tasks:
  - style_name: Zombie_Transformation
    folder: Media Files/Wan V3 I2V/0917 4 Styles/Zombie_Transformation
    prompt: |
      An 8-second continuous shot using the uploaded photo as the reference image and first frame — the person, their pose, their clothing, and the entire environment stay exactly as shown in the reference, with no new objects, people, or set elements added anywhere in the shot. Over the full 8 seconds, the person slowly and gradually turns into a zombie while remaining in the same spot. From 0 to 1.5 seconds, their skin very slowly starts losing color, turning faintly pale at the face while the eyes begin to glaze over. From 1.5 to 3 seconds, the neck slowly bends to one side at an unnaturally sharp angle, well past a normal range of motion, with a slight cracking motion as it settles. From 3 to 4.5 seconds, one shoulder rotates slowly inward and downward at a wrong angle while the wrist on that side bends backward past its natural limit, fingers curling stiffly, the whole posture turning asymmetric and stiff. From 4.5 to 5.5 seconds, the neck bends a second time in the opposite direction into another unnatural angle, while grey-green discoloration and dark veining spread slowly from the neck up to the jaw. From 5.5 to 6.5 seconds, the mouth slowly falls open wider than normal and thick saliva pools at the corners of the mouth, stretching into long drooping strands that drip slowly off the chin one drop at a time. From 6.5 to 7 seconds, the existing clothing slowly tears at the shoulder seam and sleeve from the strain of the twisted joints, revealing scraped skin beneath, without changing the clothing's original color or style. From 7 to 8 seconds, the fully transformed zombie suddenly snaps upright and lunges directly toward the camera in a stiff, shambling run, neck still held at its unnatural bent angle, arms reaching forward, saliva flying loose with the motion. Camera stays locked at eye level, static, matching the framing of the reference photo, from 0 to 7 seconds, holding steady so every slow change is clearly visible; starting at 7 seconds the camera whips into a handheld first-person retreat, backing away quickly as if the viewer is fleeing, the frame shaking slightly, the zombie growing larger and nearly filling the frame by 8 seconds. Audio: slow, low guttural breathing building gradually through the transformation, a soft cracking sound at each neck and joint bend, a wet dripping sound as saliva falls, a sharp inhale and rasping growl at 7 seconds as the zombie lunges, footsteps and heavy breathing of the retreating camera in the final second. No on-screen text, no subtitles, no music.
    resolution: 720P
    ratio: "1:1"
    duration: 8
    audio_out: true

  - style_name: Nonono_Hysteria
    folder: Media Files/Wan V3 I2V/0917 4 Styles/Nonono_Hysteria
    prompt: |
      LOCKED: Continue the exact scene of the input image. Same person, same face, same hairstyle, same clothing, same background, same camera framing. The subject's gender and appearance follow the input image exactly. The camera stays completely still. One continuous unbroken take of 10 seconds.

      THE STAYS, THE LIGHT CHANGES: the stays exactly as it is in the input image. Nothing is added, removed or rearranged. Only the lighting and the color change. The light drains away until the room is dim and murky, lit only by a weak warm amber glow. The background and the walls from the input image are still there but fall away into heavy warm brown darkness and can barely be made out. The image sits several stops under, with rich amber and sickly yellow tones, deep brown shadows rather than pure black, and no cool or blue light anywhere. The remaining warm light rakes across one side of the face, picking out the eyes, the teeth, the edge of the cheek and the strands of hair, and falls off quickly into shadow across the shoulders and body. It reads like the same room at night, lit by almost nothing.

      FILM LOOK: shot on 35mm film. Natural filmic contrast with soft rolled-off highlights and warm halation blooming gently around the brightest edges. Heavy organic film grain, visible in the shadows. A soft lens vignette darkening the corners. Shallow depth of field, the background falling soft behind the face. Slightly soft, unsharpened image with no digital crispness. Muted amber, ochre and deep brown palette.

      THEIR EXPRESSION: a wide, fixed, unnatural open-mouthed grin with the teeth clearly showing, held without changing for the whole shot. The eyes are wide, unblinking and locked straight into the lens, catching the light. The head is tilted slightly forward and down so they look up into the camera from under the brow. The hair hangs forward around the face. The expression never softens and never becomes a normal friendly smile.

      TIMELINE:

      [0-2s] The person is already facing the camera from the very first frame, in the room from the input image. The light drains out of that room and settles into a dim warm amber glow, the space sinking into brown darkness while staying the same room. The face pulls into the wide open-mouthed grin, the teeth appearing, the eyes widening and locking onto the lens.

      [2-4.5s] The head begins turning slowly and fully to one side, then slowly all the way back to the other, a long deliberate "no" motion. The mouth opens wide and shapes one single word at a time with clear pauses between them — "no... no... no..." — calm, slow, almost patient, each word spoken deliberately while the grin never leaves the face. The unnatural stillness of the body under this slow motion is what feels wrong.

      [4.5-7s] The rhythm begins to accelerate. The head turns faster and the arc gets shorter, the pauses between the words closing up, the voice tightening, the words coming quicker and quicker — "no no no no" — the grin stretching wider, the eyes fixed and beginning to bulge.

      [7-10s] The action tips over into full hysteria without ever stopping: the head whipping side to side fast and hard, the hair flying with it, the mouth opening wider on every word, the repetitions running into each other faster and faster, the eyes wide and still locked on the lens. The shoulders, arms and hands stay completely still — all of the frenzy is in the head and the face. The shot ends mid-rhythm at full intensity.

      AUDIO: the person's own voice. It begins slow, low and deliberate — single flat words with silence between them, unnervingly calm. Over the shot the tempo builds steadily: the pauses close, the pitch climbs, the voice tightens and starts to crack and fray, breath catching and gasping between repetitions, until the words are tumbling over each other, raw, unhinged and desperate, right at the edge of a scream without becoming one. Recorded close and dry with no reverb, uncomfortably intimate. Underneath it, a very quiet low room tone with a faint tape-like hiss. No music.

      SUBTITLE: the words "no no no no no no" appear as a single clean line of plain white sans-serif subtitle text, centered along the bottom of the frame, on screen for the whole shot.

      THROUGHOUT THE ENTIRE SHOT:
      The person's face, hairstyle, clothing and identity stay identical to the input image, and the frame contains only this one person.
      The room and the background stay the same as the input image for the whole shot — nothing is added, removed or rearranged, and only the lighting and color change.
      The mouth stays open with the teeth visible for the whole shot and never closes into a gentle smile.
      The eyes stay wide and fixed on the camera for the whole shot.
      The body stays still from the shoulders down — only the head and face move.
      The tempo of the head movement and the words only ever increases, never slows down and never pauses once it has started.
      The room stays dim and warm from 2s to the end, with only the face catching the light.
      The camera framing stays as it is in the input image, and the camera never moves.
      Everything runs at normal speed in one continuous unbroken take, with no interruptions of any kind.

      Style: photorealistic 35mm film, heavy organic grain, warm tungsten low-key lighting, amber and deep brown palette, soft halation, lens vignette, shallow depth of field, restrained static camera, deeply unsettling mood, seventies horror cinematography.
    resolution: 720P
    ratio: "1:1"
    duration: 10
    audio_out: true

  - style_name: Soul_Leaving_Body
    folder: Media Files/Wan V3 I2V/0917 4 Styles/Soul_Leaving_Body
    prompt: |
      LOCKED: Continue the exact scene of the input image. Same person, same face, same hairstyle, same clothing, same room, same lighting, same camera framing. The camera stays completely still. One continuous uncut take of 7 seconds.

      THE PHYSICAL PERSON'S EYES STAY CLOSED: the physical person's eyes stay closed for the entire shot, from the first frame to the last, and never open at any moment. Only the translucent figure ever opens its eyes. The physical person never opens hers, never looks up and never looks at the camera.

      THE PHYSICAL PERSON'S POSTURE: she does not simply tuck her chin while standing straight. Her whole upper body slumps forward — her back curves over, her shoulders roll forward and downward, she leans forward from the waist, and her head hangs down loosely so that her face points at the floor. Her arms hang limp. It reads like someone drifting off to sleep on their feet and folding forward where they stand. This forward slump is clearly visible in her silhouette, not just in her head.

      THE PALE FIGURE ONLY MOVES STRAIGHT UP: it emerges directly behind the physical person and rises vertically, staying on the same vertical center line as them for the whole shot. It never moves left or right, never drifts sideways and never shifts off center. The two heads are separated only by height — the pale figure's head sits directly above the physical person's hanging head — never by any sideways offset.

      THE AIR STAYS CLEAR: the air in the room stays completely clear and empty for the whole shot. Nothing floats, curls, coils, swirls or drifts anywhere in the frame. The translucent figure has no trailing shapes, no ribbons and no decorative patterns around it — the frame contains only the two figures and the unchanged room.

      THE PHYSICAL PERSON KEEPS THEIR ORIGINAL COLORS AT ALL TIMES: their clothing stays its original color, their skin stays its original tone, and their hair stays its original color and darkness for the whole shot.

      CLOTHING: the translucent figure wears exactly the same garments as the person in the input image — the same type of clothing, the same cut, the same collar, the same sleeve length, the same layers and the same silhouette, matching them piece for piece. Only the color is bleached pale and the fabric is made half-transparent. The design of the garments never changes and is never replaced with any different clothing.

      SCALE AND ALIGNMENT: the translucent figure is the same person at the same scale — the same body size, the same head size and the same facial proportions as the physical person. It is never larger, never taller, and never has a bigger head. It stands directly behind the physical person, centered on the same vertical line, its torso over their torso, so it clearly comes out of the body. Its head sits higher, in the space the slumped body has left open above.

      THE KEY DIFFERENCE: the physical person is slumped forward with her head hanging and her face pointing toward the floor, while the translucent figure stands fully upright with its head raised and its face turned toward the camera. One is folded forward, one is standing straight — the two postures are completely different at all times.

      TEXTURE OF THE TRANSLUCENT FIGURE: its face is the most solid part of it — the facial features stay clearly defined and keep the same proportions and faint traces of natural color in the lips and eyebrows, the expression calm and still, so the face reads as a real face and not as a white mask. Its hair is pale silver-white, hanging naturally in the same style as the person's hair, drifting very slowly as if suspended, the ends softening and fading gently into the air rather than ending in a sharp line. Its garments keep the same seams, folds, collar and fabric weave as the original clothing, only bleached pale and half-transparent. The opacity falls off gradually from the face outward: the face is the clearest, the shoulders and torso are half-transparent with the room visible through them, and the lower body and the outer edges dissolve completely into soft haze. There is no hard outline anywhere. The whole figure carries a soft diffuse inner glow, slightly brighter than the room, and takes on the color temperature of the room's light — cool blue-white in cool light, warm cream-white in warm light.

      TIMELINE:

      [0-1.5s] The person is already alive and moving from the very first frame, eyes closed — slow natural breathing, faint hair movement, subtle fabric shifting. Her whole upper body then slumps forward: her back curves over, her shoulders roll forward and down, she leans forward from the waist, her head hangs loosely so her face points at the floor, and her arms hang limp. By 1.5s this forward slump is complete and she holds it. She stays in the same spot with her eyes closed. The air stays clear.

      [1.5-4.5s] A translucent figure of the same person slowly separates out of her slumped body, its form lifting free and settling into a fully upright standing posture at the same scale, wearing the same garments. It rises straight up directly behind her, staying on the same vertical center line and never moving sideways, its torso over her torso, while its head rises into the open space her hanging head has left and turns to face the camera. Its head ends up directly above her hanging head. Its lower half fades out softly and stays merged into the person below. Its eyes stay closed during this rise. She stays slumped forward, solid and unchanged, with her eyes closed. The air stays clear.

      [4.5-5.2s] Only the translucent figure's eyes open. Its eyelids lift gently until its eyes are fully open and looking toward the camera, and its expression stays calm and still. It stays directly behind her and does not move sideways. The physical person's eyes stay closed and her head stays hanging — nothing about her changes. The air stays clear.

      [5.2-7s] The translucent figure stays exactly where it is, holding its upright position directly behind her with its eyes open and its face toward the camera for the rest of the shot. It never sinks back, never fades away, never disappears and never drifts to either side. Only its pale hair and its soft outer edges drift almost imperceptibly. She stays exactly as she was at 1.5s — slumped forward, head hanging, face down, eyes closed, solid and in her original colors, breathing faintly. The air stays clear. The shot ends with both of them still there.

      THROUGHOUT THE ENTIRE SHOT:
      The physical person's eyes stay closed for all seven seconds and never open at any moment.
      Only the translucent figure ever opens its eyes; the physical person never does.
      The physical person stays slumped forward with her upper body folded over from 1.5s to the final frame, and never straightens up and never stands upright again.
      The translucent figure stays fully upright the whole time, and the contrast between her folded posture and its straight posture is clearly visible.
      The translucent figure stays centered on the same vertical line as her at every moment and never moves left or right.
      The separation between the two heads is vertical only, with the pale head directly above the hanging head.
      The air in the room stays clear and empty, and nothing floats, curls or drifts anywhere in the frame at any moment.
      The translucent figure's clothing matches her clothing piece for piece at every moment — same garments, same cut, same silhouette, only bleached and half-transparent.
      The translucent figure stays the same size and the same body proportions as her for the whole shot.
      Exactly one solid figure is present at every moment, and the translucent figure stays semi-transparent from the moment it appears to the final frame.
      The translucent figure keeps a clear human shape with a recognizable, naturally detailed face and visible arms at every moment.
      Once the translucent figure's eyes have opened they stay open for the rest of the shot.
      She keeps her head hanging for the whole shot and never looks up.
      The room, the furniture, the lighting and the background stay exactly as they are in the input image, and the frame contains only this one person.
      All motion is slow, smooth and continuous, in a single unbroken take.
      The image stays clean, with no text, captions, subtitles or watermark anywhere.

      Style: photorealistic, cinematic, poetic, dreamlike, soft artistic double exposure, gentle atmosphere, subtle film grain.
    resolution: 720P
    ratio: "1:1"
    duration: 7
    audio_out: true

  - style_name: Fall_Into_Backrooms
    folder: Media Files/Wan V3 I2V/0917 4 Styles/Fall_Into_Backrooms
    prompt: |
      TIMELINE:

      [0-1.2s] The person is already alive and moving from the very first frame, in the same pose and place as the input image. Ordinary casual movement — natural breathing, a shift of weight, the head and gaze turning, hair and clothing responding, the background drifting slightly with the handheld motion. Calm, ordinary and completely uneventful.

      [1.2-1.5s] In a single instant the ground beneath them breaks and they fall through it at the same moment, with no warning and no reaction. The body drops with full dead weight, sinking straight down fast, the head and shoulders disappearing below the surface almost immediately, limbs compact and close to the torso, heavy motion blur smearing across the body. The camera lurches down with them in the same instant.

      [1.5-2.1s] The bright world above shrinks away and the frame fills with darkness, tumbling camera movement and heavy rushing motion blur. Nothing can be read in the frame.

      [2.1-2.6s] The fall ends abruptly. The person hits a damp carpeted floor hard and clumsily inside a long Backrooms corridor, landing flat on their chest, shoulder and hip, the body crumpling flat on contact, the camera jolting with the impact and settling.

      [2.6-5s] The person stays lying face-down flat on the carpet in exactly the position they landed in, in the same spot, for the rest of the shot. Their chest, stomach, hips and legs stay pressed against the floor. Only the head, shoulders and hands move. They slowly lift their head and look around, quietly disoriented — blank, dazed and uncomprehending, lips slightly parted, breathing shallow and uneven, eyes unfocused and drifting. They turn their head slowly to one side, then weakly look back over their shoulder down the corridor. The shot ends with them still lying there, small and stranded in the endless hallway.
    resolution: 720P
    ratio: "1:1"
    duration: 5
    audio_out: true

comments:
  endpoint: |
    All four wan_v3 platforms share the /wan_v3 route on the video_effect testbed.
    This one sends the prompt plus the source image as first_frame — the reference
    image/video galleries, audio, last_frame, document, and web page URL are all
    left empty.
  root_folder: |
    Root folder holding the dated style subfolders. Informational only — each task
    points at its own folder.
  folder: |
    Task folder containing the 'Source' subfolder with source images.
    Generated_Video and Metadata subfolders are created automatically.
  generation_count: |
    Videos generated per source image. Global here, overridable per task.
  default_settings: |
    Global default settings applied to all tasks. Any of these keys can also be set
    per task to override the global value.
  resolution: |
    Output video resolution.
    Options: '480P', '720P', '1080P'
    Default: '1080P'
  ratio: |
    Video aspect ratio. 'adaptive' follows the source image.
    Options: '16:9', '9:16', '1:1', '4:3', '3:4', 'adaptive'
    Default: 'adaptive'
  duration: |
    Video duration in seconds. Ignored when duration_auto is true.
    Default: 5
  duration_auto: |
    Let the model pick the duration instead of using the duration value.
    Default: false
  audio_out: |
    Generate an audio track with the video.
    Default: true
  thinking: |
    Enable the endpoint's prompt reasoning pass before generating.
    Default: false
  prompt: |
    Text prompt describing how the source image should animate.
  expected_folder_structure: |
    root_folder/
    └── 0806 21 Styles/
        └── Dog_Run_To_Owner/
            ├── Source/            # input images
            ├── Generated_Video/   # {image_name}_{n}.mp4 (auto-created)
            └── Metadata/          # auto-created
