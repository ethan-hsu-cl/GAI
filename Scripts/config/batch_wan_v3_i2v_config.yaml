tasks:
  - style_name: Pink_Skeleton
    folder: Media Files/Wan V3 I2V/0921 2 Styles/Pink_Skeleton
    prompt: |
      LOCKED: Continue the exact scene of the input image. Same person, same face, same hairstyle, same clothing, same location, same camera framing. The camera stays completely still. One continuous uncut take of 7 seconds. This is a stylized neon light-art photography effect.

      THE EYES GLOW PINK: both eyes glow the same hot pink as the bones, lit from within, so the eye sockets read as two soft pink lights in the face. The glow fills the whole eye area with a gentle bloom spreading onto the surrounding skin. The eyes stay glowing pink from the moment the light comes up until the final frame and never go dark, never return to normal eyes and never change color.

      THE MOVEMENT: the person walks slowly forward toward the camera for most of the shot, then comes to a stop and settles into a final pose. The walk is unhurried and heavy — loose-limbed, slightly languid, the weight dropping into each step, the arms hanging slack and swinging only a little, the head carried slightly low. It reads as tired and drained, almost undead, but it is still a smooth walk and never an exaggerated stagger or a lurch.

      THE FINAL POSE: they come to rest standing in a slouched contrapposto — the weight dropped fully onto one leg with that hip pushed out to the side, the other leg loose and slightly forward with the knee soft, the shoulders slumped and uneven, one shoulder lower than the other, the head tilted slightly to one side with the chin a little down, the arms hanging heavy and limp at the sides. It is a languid, drained, undead-looking stance that still reads as a deliberate fashion pose. They hold it without moving, their glowing pink eyes facing the camera.

      THE SCENE DIMS: the ambient light in the scene gradually falls away until the surroundings are dim and shadowy, like late dusk, so that the glow inside the body becomes the brightest thing in the frame. The location itself stays exactly the same — the same place, the same background, nothing added or removed — only darker and cooler. The person stays clearly visible throughout.

      THE GLOW IS INSIDE THE BODY: a glowing hot-pink neon light drawing of the bones appears inside the person's body, seen through the skin and through the clothing as if the body were lit from within. The glowing bones are anatomically correct and perfectly aligned with the body's actual pose at every single frame — the spine follows the curve of the back, the ribcage sits inside the chest, the pelvis sits at the hips, the arm and leg bones run inside the limbs, the finger bones inside the hands. As the body walks, every bone bends, swings and shifts exactly with the limb it belongs to, staying locked inside the body at all times. It never slides, never lags behind the body, never drifts out of alignment, is never pasted on top of the body, never floats beside it and never sits in front of the clothing as a flat shape.

      COLOR AND LOOK: the bones glow a saturated hot pink and magenta, like bright neon tubing, with a soft pink bloom spreading a short distance into the surrounding skin and fabric. The skin becomes pale, cool and porcelain-like, desaturated almost to white, while staying natural human skin with visible texture. The clothing keeps its own shape and material but takes on a soft pink cast where the light passes through it. The pink light spills faintly onto the ground and the nearest surroundings, as a real light source would, and that spill moves with them as they walk.

      THE GLOW APPEARS GRADUALLY: it does not switch on suddenly and is never absent in one frame and present in the next. It begins as the faintest warm pink flush deep inside the chest, then spreads outward along the spine, into the ribs, down into the pelvis and out through the arms and legs, and the eyes come up at the same time, brightening smoothly and evenly frame by frame until the whole skeleton and both eyes are fully lit.

      WHAT STAYS THE SAME: the person's face, hairstyle, body proportions and clothing stay exactly as they are in the input image. The background, the location and the camera framing never change. The frame contains only this one person.

      TIMELINE:

      [0-1.5s] The person is alive and moving from the very first frame. They take their first slow, heavy steps forward toward the camera, the weight dropping into each step, arms hanging loose. Everything still looks completely ordinary. The ambient light begins to fall away and the scene starts to dim.

      [1.5-4.5s] The scene settles into dim dusk light. They keep walking slowly forward at the same unhurried pace, growing larger in the frame as they approach. Inside the chest a faint pink glow appears, then spreads outward along the spine, into the ribcage, down into the pelvis and out through the arms and legs, brightening steadily and evenly with every frame. At the same time both eyes begin to glow the same hot pink, faint at first and strengthening with the bones. The bones swing and bend with the walking limbs, staying locked inside the body. The skin cools and pales as the glow strengthens.

      [4.5-5.5s] They slow down and come to a stop, settling into the slouched contrapposto pose — weight dropping onto one leg, that hip pushing out, the other knee soft, the shoulders slumping unevenly, the head tilting slightly with the chin down, the arms hanging heavy. At the same moment the glowing skeleton reaches its full brightness — saturated hot pink neon bones clearly readable inside the body from head to feet, both eyes glowing bright pink in the face, a soft pink bloom on the skin and fabric and faint pink light spilling onto the ground around them.

      [5.5-7s] They hold the pose completely, only breathing, the fabric and hair settling. The skeleton stays fully lit at the same brightness and both eyes stay glowing pink, pulsing only very faintly with the breathing. The glow never fades out and never disappears. The shot ends with them standing in the pose, the skeleton lit and the eyes still glowing pink.

      THROUGHOUT THE ENTIRE SHOT:
      Both eyes glow hot pink from the moment the light comes up to the final frame, and never go dark and never return to normal eyes.
      The glowing bones stay inside the body at all times, anatomically aligned with the body at every frame, and move with every step, swing and shift of the limbs.
      The glow appears as one smooth continuous build with no sudden switch-on.
      The person's face, hair and clothing stay identical to the input image.
      The walk stays slow, smooth and heavy, and never becomes an exaggerated stagger, a lurch or a run.
      The person stays alive and breathing the whole time and never freezes into a still image.
      The camera is completely static — no pan, no tilt, no zoom and no drift. Only the person moves, growing larger in frame as they approach.
      The background and the location stay exactly the same, only dimmer, with nothing added or removed.
      The glow stays hot pink and magenta throughout and never changes to another color.
      Once the skeleton and the eyes are fully lit they stay fully lit to the final frame.
      The image stays clean, with no text, captions, subtitles or watermark anywhere.

      Style: photorealistic fashion editorial photography, neon light art, saturated hot pink and magenta glow, pale cool skin, dim dusk surroundings, soft bloom, shallow depth of field, cinematic, subtle film grain.
    resolution: 720P
    ratio: "1:1"
    duration: 7
    audio_out: true

  - style_name: Crawl_Out_Of_TV
    folder: Media Files/Wan V3 I2V/0921 2 Styles/Crawl_Out_Of_TV
    prompt: |
      LOCKED: Continue the exact scene of the input image. Single continuous take, camera locked in the exact framing of the reference image, completely static — no zoom, no pan, no shake, no cuts. The room, the floor, the furniture, the curtains, the sliding door and the TV stand stay exactly as in the reference throughout. Total duration 10 seconds.

      NO RING AND NO GLOWING EDGE: where the body crosses the screen plane there is no ring, no halo, no glowing outline, no bright rim, no circle of light and no arc of light of any kind. The crossing point is completely invisible — the body simply continues from inside the screen to outside it with nothing drawn at the boundary at all. No bright shape ever appears around the person.

      THE SCREEN KEEPS ITS SHAPE: the television screen stays its normal rectangular shape with its normal slightly rounded CRT corners for the entire shot. It never becomes a circle, never becomes an oval, never opens into a hole and never changes shape or size. Its brightness stays even across the whole screen and never concentrates into a bright shape or a bright edge.

      NO MEMBRANE, NO STRETCHING: the screen surface never bulges, never stretches, never deforms and never behaves like a thin plastic film, cling film or rubber sheet. The glass stays perfectly flat and rigid at all times. The body passes straight through the flat plane of the screen as if the glass simply were not there. Nothing ever clings to the body, wraps around it or is pulled outward with it.

      THE ROOM STAYS DARK: the room stays exactly as dark as in the reference image for the whole shot. The ceiling light stays off, the curtains stay drawn, and the television screen remains the only real light source in the room. The corners, the ceiling and the open sliding door stay in deep shadow. The room never brightens, and no daylight and no new light source ever appears.

      LIGHTING ON THE PERSON: the parts of them still inside the screen stay lit as a television image. The parts that have come out into the room are lit only by the soft glow of the screen itself, spilling onto their arms, face and shoulders from below and behind, with the dark room falling away around them. They stay clearly visible and readable at all times.

      TIMELINE:

      [0-1.5s] The person stays inside the television screen, palms pressed flat against the glass, looking out at the camera. The screen's faint static flickers normally. Nothing else in the room moves.

      [1.5-3s] They press harder and their hands begin to pass through the flat plane of the screen. The glass itself stays completely flat, rectangular and rigid and does not move at all. Nothing lights up at the point where their hands cross.

      [3-5.5s] Their hands come fully out into the room, followed by their forearms, and they grip the outer edges of the television frame from outside. The screen behind them keeps its normal rectangular shape and its normal even brightness.

      [5.5-8s] Their head and shoulders push out through the screen plane into the room. They are now leaning out of the television from the waist up, hands braced on the TV frame, their upper body softly lit by the screen glow while their lower half is still inside the screen image. They pause, look slowly around the dark room, then look straight at the camera.

      [8-10s] Still leaning half out of the screen, they smile and raise one hand off the TV frame in a friendly wave toward the camera, holding it until the final frame.

      THROUGHOUT THE WHOLE SHOT:
      No ring, halo, glowing outline or bright rim ever appears anywhere around the person or around the screen.
      The screen stays rectangular with its normal even brightness at every moment and never becomes a circle, an oval or an opening.
      The screen glass stays flat and rigid at every moment and never deforms in any way.
      The person's face, hair, clothing and every physical detail stay exactly as they appear in the reference image at all times — the same individual throughout, with no change to their features, hairstyle or outfit as they emerge, and never replaced with a different person.
      They stay calm, healthy and unthreatening — natural skin tone, normal eyes, a relaxed expression. All of the eeriness comes from the dark room, never from the person.
      They do not climb all the way out — they stay half in, half out of the television for the whole shot.
      Movements are natural, relaxed and unhurried, like someone leaning out of a window.
      The room stays dark for the whole shot and the television stays the only light source.
      The camera never moves and there are no cuts.
      The image stays clean, with no text, captions, subtitles or watermark anywhere.

      Style: photorealistic, cinematic, desaturated cool palette of grey, faint green and cold blue, deep crushed shadows, the screen as the only light accent, quiet Japanese horror atmosphere with a warm friendly beat at the end, visible film grain.
    resolution: 720P
    ratio: "1:1"
    duration: 10
    audio_out: true


comments:
  endpoint: |
    All four wan_v3 platforms share the /wan_v3 route on the video_effect testbed.
    This one sends the prompt plus the source image as first_frame — the reference
    image/video galleries, audio, last_frame, document, and web page URL are all
    left empty.
  root_folder: |
    Root folder holding the dated style subfolders. Informational only — each task
    points at its own folder.
  folder: |
    Task folder containing the 'Source' subfolder with source images.
    Generated_Video and Metadata subfolders are created automatically.
  generation_count: |
    Videos generated per source image. Global here, overridable per task.
  default_settings: |
    Global default settings applied to all tasks. Any of these keys can also be set
    per task to override the global value.
  resolution: |
    Output video resolution.
    Options: '480P', '720P', '1080P'
    Default: '1080P'
  ratio: |
    Video aspect ratio. 'adaptive' follows the source image.
    Options: '16:9', '9:16', '1:1', '4:3', '3:4', 'adaptive'
    Default: 'adaptive'
  duration: |
    Video duration in seconds. Ignored when duration_auto is true.
    Default: 5
  duration_auto: |
    Let the model pick the duration instead of using the duration value.
    Default: false
  audio_out: |
    Generate an audio track with the video.
    Default: true
  thinking: |
    Enable the endpoint's prompt reasoning pass before generating.
    Default: false
  prompt: |
    Text prompt describing how the source image should animate.
  expected_folder_structure: |
    root_folder/
    └── 0806 21 Styles/
        └── Dog_Run_To_Owner/
            ├── Source/            # input images
            ├── Generated_Video/   # {image_name}_{n}.mp4 (auto-created)
            └── Metadata/          # auto-created
