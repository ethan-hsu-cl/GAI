comments:
  endpoint: |
    All four wan_v3 platforms share the /wan_v3 route on the video_effect testbed.
    This one sends the prompt plus the source image as first_frame — the reference
    image/video galleries, audio, last_frame, document, and web page URL are all
    left empty.
  root_folder: |
    Root folder holding the dated style subfolders. Informational only — each task
    points at its own folder.
  folder: |
    Task folder containing the 'Source' subfolder with source images.
    Generated_Video and Metadata subfolders are created automatically.
  generation_count: |
    Videos generated per source image. Global here, overridable per task.
  default_settings: |
    Global default settings applied to all tasks. Any of these keys can also be set
    per task to override the global value.
  resolution: |
    Output video resolution.
    Options: '480P', '720P', '1080P'
    Default: '1080P'
  ratio: |
    Video aspect ratio. 'adaptive' follows the source image.
    Options: '16:9', '9:16', '1:1', '4:3', '3:4', 'adaptive'
    Default: 'adaptive'
  duration: |
    Video duration in seconds. Ignored when duration_auto is true.
    Default: 5
  duration_auto: |
    Let the model pick the duration instead of using the duration value.
    Default: false
  audio_out: |
    Generate an audio track with the video.
    Default: true
  thinking: |
    Enable the endpoint's prompt reasoning pass before generating.
    Default: false
  prompt: |
    Text prompt describing how the source image should animate.
  expected_folder_structure: |
    root_folder/
    └── 0806 21 Styles/
        └── Dog_Run_To_Owner/
            ├── Source/            # input images
            ├── Generated_Video/   # {image_name}_{n}.mp4 (auto-created)
            └── Metadata/          # auto-created
