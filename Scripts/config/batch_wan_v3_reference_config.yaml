      Reference images: all reference images show the garment(s) for one single outfit, possibly from different angles (front, back, side), as close-up details, or as separate pieces of the outfit (e.g. top and bottom); combine them into one complete outfit. Identify each view by its content, not by upload order: an image showing the neckline and front opening is the front, an image showing the shoulder blades or back neckline is the back, and a cropped close-up is a detail. Use the front view whenever the front is visible, the back view whenever the back is visible, and the side or detail images for the side angles. If no back view is provided, keep the back simple, plain and consistent with the front's color, fabric and style, without inventing new design elements. Use the reference images only for the garment; ignore any person, face, pose, mannequin or background in them. The garment is always worn on the model's body.

      Styling: first identify every piece shown in the reference images.
      - Outer layers: jackets, coats, overcoats, parkas, puffers, down jackets, shells, anoraks, windbreakers, blazers, trucker jackets and zip-up hoodies.
      - Tops: hoodies, sweatshirts, shirts, knitwear, vests and tees. Outer layers and tops are never worn as a dress; they always end at the hips, thighs or knees with trousers visible below.
      - Bottoms: trousers, jeans, shorts and joggers.
      Rules:
      - Inner layer: whenever the garment is an outer layer, he always wears a plain cream ribbed turtleneck sweater underneath, whether the outer layer is buttoned, zipped or open. The turtleneck fills the neckline, lapel opening or collar opening completely. His chest and the area below his neck are never bare and no skin is visible between the lapels or collar. If the reference images already include an inner top, use that inner top instead.
      - Bottoms: if the reference images include a bottom, he wears exactly that bottom. If they show no bottom, he must always wear slim-fit tapered black trousers; his legs are never bare. If they show only a bottom, pair it with a plain fitted crew-neck knit in a neutral color that matches the bottom.
      - Shoes are always worn: clean minimalist white leather sneakers.
      - Any added piece must be plain, with no logos or prints, so the reference garment stays the focus.

      Cinematography: vertical 9:16, one single continuous take from the first frame to the last, with no cuts, no jump cuts and no sudden changes in framing. The camera begins moving in the very first frame and performs one slow, smooth, steady push-in at a constant speed across the entire video, starting on a full-body shot, head to shoes, and gradually closing in to a waist-up shot by the final frame. The framing changes gradually and continuously; it never jumps or snaps.

      Subject: a handsome European man in his mid-twenties, tall and lean with broad shoulders. Thick, natural golden-blond hair, slightly longer on top and neatly swept back with soft texture, short and tidy on the sides. Fair skin with a light natural tan, light stubble, a strong defined jawline, straight nose, light blue-grey eyes and natural brows. A calm, composed, quietly confident expression. He wears the exact outfit from the reference images as the hero piece.

      Action: he stands relaxed in place, feet slightly apart, arms hanging naturally at his sides with empty hands. Starting facing the camera, he slowly turns in place in one direction through one full continuous 360-degree rotation: from the front to a side profile, to a full back view where he pauses briefly so the back of the garment is clearly visible, then on through the other side profile, ending at a three-quarter front view with his gaze resting just past the lens. The rotation is slow, smooth and steady, at an even pace, with natural small steps. He does not walk away from his spot.

      Context: an architectural exposed-concrete space. Behind him, a large wall of smooth, high-quality board-formed concrete in soft warm grey, with crisp horizontal and vertical formwork panel lines and evenly spaced round tie holes in a precise grid, showing subtle natural tonal variation and fine texture. The floor is polished light-grey concrete with a soft sheen. The space is clean, minimal and empty, with no props or furniture.

      Lighting & style: soft natural daylight from a tall window out of frame to one side, washing gently across the concrete wall and revealing its texture, soft directional shadows, a calm neutral palette of warm greys and off-whites, true-to-life garment color, subtle shallow depth of field. Premium menswear brand film, architectural and refined, crisp fabric detail.

      Garment fidelity: the cut, fit, length, colors, fabric texture, collar, lapels, hood, zipper, buttons, snaps, pockets, flaps, cuffs, hem, seams, vents, back design, logos and prints must match the reference images exactly. Do not alter, add or remove any design element. The front must match the front reference and the back must match the back reference. Fabric drapes, folds and moves naturally as he turns.

