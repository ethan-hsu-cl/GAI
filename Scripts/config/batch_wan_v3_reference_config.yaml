  - effect: Accessories 配件 2
    prompt: |
      Reference images: all reference images show one single jewelry or small accessory product, possibly from different angles (front, side, back), as close-up details, or as a matching pair. Treat them all as the same product. Identify each view by its content, not by upload order. Use the reference images only for the product; ignore any person, hand, ear, neck, mannequin, packaging, props or background in them. Show exactly the quantity shown in the reference images: a single item stays a single item, and a pair (such as earrings) is shown as one matching pair. No duplicates and no extra products.

      Set: a warm, minimal still-life set in a single soft beige palette. A smooth matte beige surface, a plain warm-beige wall behind it, and one prop: a large, smooth, rounded sculptural stone, shaped like an oversized river-polished pebble, in matte warm sand-beige with a very fine, soft texture. The stone is the only prop. Nothing else is in the set.

      Placement: the product stands or rests naturally and stably, always in direct contact with the stone, the way it is normally displayed in a jewelry campaign:
      - Earrings: the pair stands upright on the surface, leaning gently against the curved side of the stone.
      - Ring: standing upright on its band, the stone or main detail facing the camera, leaning gently against the stone.
      - Bracelet or bangle: standing upright on its edge, leaning gently against the stone.
      - Necklace: draped gracefully over the top of the stone, the pendant or main detail hanging at the front.
      - Watch: standing upright with the face toward the camera, the strap curved behind it, leaning gently against the stone.
      - Any other small accessory: in its most natural, stable display position, leaning gently against the stone with its front toward the camera.
      This placement is identical in all three shots: the product keeps exactly the same position, angle and contact with the stone throughout the entire video and stays completely still. Only the camera changes between shots.

      A 10-second vertical 9:16 luxury jewelry product film made of three shots with hard cuts.

      Shot 1 (0-3.3s), close-up: the product leaning against the stone, filling most of the frame, the camera low at the product's own height. The camera slides slowly and smoothly sideways across the product, with a very slight push-in. The stone is right behind and touching the product, softly blurred, with the wall beyond it. Very shallow depth of field.

      Shot 2 (3.3-6.5s), extreme macro: an ultra-close detail of the product's most distinctive feature that is clearly visible in the reference images, such as a clasp, hinge, setting, gemstone, engraving, chain link, texture or polished curve, framed against the plain warm-beige wall. The camera drifts very slowly sideways. Only show details that exist in the reference images; do not invent any.

      Shot 3 (6.5-10s), medium shot: a wider view of the exact same placement as Shot 1. The product is still leaning against the stone, in direct contact with it, in exactly the same position and angle. The stone is clearly visible right beside and behind the product, close to it and only gently softened by depth of field, not pushed far into the background. If the product is a pair, the two pieces stand side by side, slightly overlapping, both leaning against the stone. The camera, at the product's height, slowly and smoothly pulls back until the whole product and the part of the stone it leans on sit fully in frame with calm space around them, and holds on that final composition.

      Lighting & style: soft, warm, directional side light like late-afternoon window light, gentle soft-edged shadows falling across the surface and the stone, smooth glowing highlights rolling along polished metal and sparkling softly in any stones, rich but natural tones, true-to-life product color, a calm monochrome beige and warm-grey palette, very fine detail, creamy shallow depth of field. Quiet, elegant luxury jewelry campaign.

      Product fidelity: the shape, proportions, size, thickness, colors, metal tone and finish (polished, brushed, matte), gemstones, settings, clasps, hinges, chains, engravings, logos and any text on the product must match the reference images exactly. Do not alter, add or remove any design element. Do not add new text or logos, and do not change or misspell any that exist. The warm light must not change the true metal tone or stone colors.

      Avoid: the product standing apart from the stone, the product standing alone in front of the stone, the stone far away in the background, the product changing position between shots, a bowl, cup, dish or vase, more than one prop, the product moving, rotating, falling or floating, hands, ears, necks or people, a model wearing the product, duplicate or extra products, packaging, flowers or decorations, distorted, bent or melted metal, broken or warped shapes, added or misspelled text or logos, subtitles or watermarks, harsh blown-out highlights, flat lighting, stiff or jerky motion.
    resolution: 720P
    ratio: '9:16'
    duration: 10

comments:
  endpoint: |
    All four wan_v3 platforms share the /wan_v3 route on the video_effect testbed.
    This one sends the prompt plus the source image and every reference image in the
    'images' gallery — first_frame/last_frame, the video and audio inputs, the
    document, and the web page URL are left empty.
  base_folder: |
    Root folder containing effect subfolders. Each effect folder should have
    'Source' and 'Reference' subfolders; 'Generated_Video' and 'Metadata' are
    created automatically.
  tasks: |
    Each task represents one effect. The effect name must match the subfolder name
    under base_folder. Effect folders found on disk but missing from tasks are
    processed with default_prompt.
  effect: |
    Effect/style name. Used for folder matching and output naming.
  prompt: |
    Text prompt guiding the generation. Reference images are addressable in the
    prompt as image1, image2, ... in gallery order (source first).
  reference_images: |
    Paired mode: name a Reference file after its source (Reference/01.jpg or
    Reference/01_back.jpg for Source/01.jpg) and each source is sent with only its
    own references, e.g. one product's front + back as image1 + image2. Used when
    any Reference file matches a source name; every source then needs a match.
    Shared mode (no name matches): every source gets the whole Reference folder.
    Reference images are picked up from the effect's 'Reference' folder. Files named
    image2/image3/... are used in that order; otherwise all files are used in sorted
    order. Capped at 9 so source + references fit the gallery's 10-image limit.
  default_settings: |
    Global default settings applied to all tasks. Any of these keys can also be set
    per task to override the global value.
  resolution: |
    Output video resolution.
    Options: '480P', '720P', '1080P'
    Default: '1080P'
  ratio: |
    Video aspect ratio. 'adaptive' follows the source image; leave it unset to use
    the aspect ratio auto-detected from the source image instead.
    Options: '16:9', '9:16', '1:1', '4:3', '3:4', 'adaptive'
    Default: 'adaptive'
  duration: |
    Video duration in seconds. Ignored when duration_auto is true.
    Default: 5
  duration_auto: |
    Let the model pick the duration instead of using the duration value.
    Default: false
  audio_out: |
    Generate an audio track with the video.
    Default: true
  thinking: |
    Enable the endpoint's prompt reasoning pass before generating.
    Default: false
  expected_folder_structure: |
    base_folder/
    └── New Year - Japan Style/
        ├── Source/            # source images (one generation each)
        ├── Reference/         # image2.png, image3.png, ... (up to 9)
        ├── Generated_Video/   # {source}_{Effect}.mp4 (auto-created)
        └── Metadata/          # auto-created
