  - effect: Clothes 服飾 3 V3
    prompt: |
      Reference images: all reference images show the garment(s) for one single outfit, possibly from different angles (front, back, side), as close-up details, or as separate pieces of the outfit (e.g. top and bottom); combine them into one complete outfit. Identify each view by its content, not by upload order: an image showing the neckline and front opening is the front, an image showing the shoulder blades or back neckline is the back, and a cropped close-up is a detail. The front view is the main reference for how the garment looks on camera; any back, side or detail images are for construction reference only. Use the reference images only for the garment; ignore any person, face, pose or background in them. Do not show the back of the garment in the video.

      Styling: first identify every piece shown in the reference images. A skirt, shorts, trousers, jeans, leggings, a dress or a jumpsuit counts as a bottom. If the reference images include any bottom, she wears exactly that bottom and nothing else is added on her legs: no trousers, no leggings, no tights and no extra layers under or over it. A skirt or dress is worn with bare legs. Only if the reference images show a top and no bottom at all, pair the top with tailored slim-fit charcoal trousers. Only if they show a bottom and no top at all, pair it with a plain fitted top in a neutral color that matches the bottom. Shoes: she wears minimalist white leather sneakers. Any added piece must be plain, with no logos or prints, so the reference garment stays the focus.

      Cinematography: one single continuous take from the first frame to the last, with no cuts, no jump cuts, no edits and no sudden changes in framing. The camera begins moving in the very first frame and performs one slow, smooth, steady push-in at a constant speed across the entire video. It starts on a full-body shot, head to shoes, and gradually closes in to a waist-up shot by the final frame, keeping the garment centered and dominant in the frame throughout. The framing changes gradually and continuously; it never jumps or snaps.

      Subject: a slim young woman in her early twenties with fair, light skin and a soft natural flush on her cheeks. Glossy dark brown, almost black hair with a soft center part, gently swept back into a loose, low chignon at the nape of her neck, with soft natural volume at the crown and a few fine, wispy face-framing strands falling around her temples and cheekbones. The hair stays behind her shoulders and never covers the neckline. A delicate, slightly narrow oval face with a soft jawline. Softly arched natural light-brown eyebrows, almond-shaped light-brown eyes, a slim straight nose and natural soft-pink lips. Fresh, clear, no-makeup look. Her expression is calm and neutral, with a steady gaze into the lens. She wears the exact outfit from the reference images as the hero piece. The garment's fabric, cut and silhouette command full visual attention.

      Action: for the first two seconds, she walks slowly toward the camera with three to four relaxed, natural steps, facing the camera the whole time. Her walk is calm and effortless, like an everyday walk, not a runway walk: each step lands heel first and rolls smoothly to the toe, her feet stay about hip-width apart and point straight forward, her knees bend softly and naturally, her arms swing gently and loosely forward and back at her sides in rhythm with her steps, and her shoulders stay relaxed and level. The steps are even in length and rhythm. She then slows down smoothly over her last step and comes to a natural stop, feet slightly apart, standing balanced. For the rest of the video, she stays on that spot and gently shifts her weight from one foot to the other, her torso swaying softly with a calm, confident rhythm that lets the garment's drape and texture move organically and catch the light. Her arms hang relaxed at her sides with empty hands. A skirt or dress swings lightly with each step and settles naturally when she stops. She keeps facing the camera, turning at most to a subtle three-quarter angle and back, never showing her back.

      Context: shot against a matte off-white cyclorama with no props or set dressing, a perfectly clean, seamless studio environment that places the product in complete visual isolation.

      Style & Ambiance: soft, even light wraps the scene with no harsh contrast, rendering the garment's fabric texture with crisp clarity against the neutral backdrop. Color grading is cool-white and precise, reinforcing the architectural, less-is-more aesthetic.

      Garment fidelity: the cut, fit, length, colors, fabric texture, neckline, hood, drawstrings, pockets, cuffs, hem, seams, zipper, buttons, logos and prints must match the reference images exactly. Do not alter, add or remove any design element.

      Avoid: stiff or locked knees, a runway catwalk with crossing feet, robotic or mechanical walking, feet sliding or gliding on the floor, uneven or mismatched steps, legs merging or swapping, arms held stiffly at her sides while walking, a sudden abrupt stop, wobbling after stopping, walking for the whole video, trousers, leggings or tights worn under a skirt or dress, layering pants with a skirt, cuts, jump cuts, scene changes, sudden zooms or framing jumps, a static camera, showing the model's back, holding any object, distorted body or clothing, extra fingers or limbs, any added text, subtitles or watermarks, logos not present on the reference garment, other people, props, stiff or jerky motion.
