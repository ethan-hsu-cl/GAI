  - effect: Clothes 服飾 1 V3
    prompt: |
      Reference images: all reference images show the garment(s) for one single outfit, possibly from different angles (front, back, side), as close-up details, or as separate pieces of the outfit (e.g. top and bottom); combine them into one complete outfit. Identify each view by its content, not by upload order: an image showing the neckline and front opening is the front, an image showing the shoulder blades or back neckline is the back, and a cropped close-up is a detail. The front view is the main reference for how the garment looks on camera; any back, side or detail images are for construction reference only. Use the reference images only for the garment; ignore any person, face, pose or background in them. Do not show the back of the garment in the video.

      A beautiful young East Asian woman in her mid-twenties, slender and graceful, wearing the complete outfit from the reference images, walks barefoot toward the camera in a warm, minimalist studio. She faces the camera from the very first frame to the last frame. Long, glossy dark-brown hair worn down in soft, loose natural waves, parted slightly off-center, swept back behind her shoulders so the neckline stays fully visible, with a few soft strands framing her face. Clear, luminous porcelain skin with a soft natural flush, gentle almond-shaped dark-brown eyes, softly arched brows, a delicate nose and soft rosy-nude lips. Fresh, dewy, minimal makeup. A serene, gentle expression with a faint, soft smile.

      Set: cream-white wall and floor. Strong afternoon sunlight streams in from the side through a large multi-pane window out of frame, casting a wide, crisp grid of window-pane shadows, many rectangular panes divided by thin mullions, across the wall and onto the floor. On the left, a cluster of three clear glass vases and bottles of different heights stands on the floor, filled with tall dried pampas grass. On the right, one tall clear glass bottle vase with pampas grass. The glass is transparent and catches the sunlight. No furniture, no stools, nothing else in the set. Beige, oat and cream earth tones with the clean sparkle of clear glass.

      Action: the video opens with her already facing the camera, standing at the far end of the room. She walks straight forward toward the camera with a relaxed, natural stride, arms swinging gently, her hair moving softly with each step. Midway she raises one hand to lightly touch the collar or neckline at her chest, showing the neckline detail, then lowers it and keeps walking, ending in front of the camera with a calm, direct gaze into the lens.

      Orientation: front view only for the entire video. She never turns around, never spins, never walks away from the camera, and her back is never shown. Her body and face stay oriented toward the camera throughout.

      Camera: vertical 9:16, one continuous shot, no cuts. Starts as a full-body wide shot, slowly pushes in as she approaches, ends on a chest-up medium close-up.

      Lighting & style: warm natural side light, soft shadows, the window-pane grid of light clearly visible on the wall behind her, sunlight glowing through the clear glass vases with soft refractions and gentle highlights, clean low-saturation earth palette, premium fashion brand film, fine detail, slight shallow depth of field.

      Garment fidelity: the cut, length, colors, fabric texture, collar, cuffs, buttons, ties, fringe, prints and every detail must match the reference images exactly. Do not alter, add or remove any design element. Fabric moves and wrinkles naturally while walking.

      Avoid: hair covering the neckline or the front of the garment, showing the model's back, turning around, walking away from the camera, any furniture or stools, distorted body or clothing, extra fingers or limbs, any text, subtitles, watermarks or logos not present on the reference garment, other people, stiff or jerky motion.
