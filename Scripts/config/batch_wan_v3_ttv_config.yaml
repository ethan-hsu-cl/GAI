comments:
  endpoint: |
    All four wan_v3 platforms share the /wan_v3 route on the video_effect testbed.
    This one sends the prompt only — the reference image/video galleries, audio,
    first/last frame, document, and web page URL inputs are all left empty.
  output_folder: |
    Root folder where generated videos will be saved.
    Generated_Video and Metadata subfolders will be created automatically.
  generation_count: |
    Global generation count. Each task generates this many videos unless overridden.
  default_settings: |
    Global default settings applied to all tasks. Any of these keys can also be set
    per task to override the global value.
  resolution: |
    Output video resolution.
    Options: '480P', '720P', '1080P'
    Default: '1080P'
  ratio: |
    Video aspect ratio.
    Options: '16:9', '9:16', '1:1', '4:3', '3:4', 'adaptive'
    Default: 'adaptive'
  duration: |
    Video duration in seconds. Ignored when duration_auto is true.
    Default: 5
  duration_auto: |
    Let the model pick the duration instead of using the duration value.
    Default: false
  audio_out: |
    Generate an audio track with the video.
    Default: true
  thinking: |
    Enable the endpoint's prompt reasoning pass before generating.
    Default: false
  prompt: |
    Text prompt describing the video to generate.
