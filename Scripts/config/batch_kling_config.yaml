  folder: Media Files/Kling 3.0/0924 6 Styles/靈魂出竅
  prompt: |-
    Static camera, no camera movement, same framing and background as the input image.

    0-3s: The person slowly closes their eyes and falls asleep in place. Their head drops low, tilting heavily forward and to one side, chin toward the chest. The sleeping person keeps their own head attached, with their face and hair fully visible, and stays solid, opaque and in full color in every frame until the end.

    3-7s: A translucent soul gently rises up from BEHIND the sleeping person's back and shoulders, drifting upward behind them. The soul has its OWN separate head, which appears in the empty space above and behind the sleeping person's shoulders, NOT at the sleeping person's head position. The sleeping person's head stays where it is, drooped to the side, and is never pulled, lifted, erased or replaced.

    7-10s: The soul straightens up behind and above the sleeping person, opens its eyes and calmly looks at the camera. In the final frame there are two heads and two faces: the sleeping person's solid head drooping in front and lower down, and the soul's translucent head upright, behind and higher up.

    The soul is a faded, translucent copy of the same person, like a photo overlaid at 40% opacity, with a soft pale-white glow and a thin glowing edge line. It is fully clothed in the exact same outfit as the input image and has the same face and hairstyle. The only difference is that the whole figure is faded and see-through.

    Out-of-body experience, spirit rising from behind the body, ethereal double exposure, cinematic realism.
