tasks:
- mode: pro
  duration: 5
  cfg: 0.5
  sound_enabled: true
  resolution: 720p
  folder: Media Files/Kling 3.0/0930 1 Style/小鬼
  prompt: |-
    Locked-off tripod shot of the exact scene in the imported photo. No zoom, pan, tilt or cuts.

    Only carved pumpkins are added. No cobwebs, other objects or lights.

    PEOPLE: Exactly the same number of people as in the photo, never more. If none, nobody enters. If a person is present, their face stays identical to the photo (eyes, nose, lips, jawline). One person glances at the monster, looks away, looks back and gives a small closed-lip smile. People never speak and stay in place.

    MONSTER: Always turn an object already in the photo into the monster. Choose the most eye-catching one, such as a bag, cushion, lamp, cup, box or book, never a person, animal, wall, floor or window, and give it cute monster features on its own surface. It keeps its exact shape, size, material and colour and is still clearly that object: no new head, body, fur or limbs. Two big round eyeballs bulge from its front: cream white, a big amber-brown iris, a black pupil, a soft satin sheen with one small soft highlight, never sparkly. Below them, a wide grin opens directly in its surface, following a seam or zip if it has one, with no lips: small pointed ivory teeth and a soft pink inside. Two short horns or rounded ears grow from its top corners. Friendly, physically real. Its body stays rigid; only its eyes blink and mouth moves. Near the start it says "Happy Halloween" once in a warm, playful little voice, mouth in sync, then keeps grinning.

    PUMPKINS: Five or six real carved pumpkins of different sizes are thrown in from beyond the left, right and bottom edges, already lit. Each flies in low from the side, slams down onto the ground with a heavy thud, bounces once, wobbles and settles still, never breaking, never falling from above. All settled by mid-shot. Ridged weathered orange skin, dry curved stalk, uneven hand-carved faces turned toward camera, warm candle glow inside. Two large ones land along the bottom edge.

    FALLBACK, RARE: Only if the photo truly contains no object at all, a small round fluffy monster, pumpkin-sized, is thrown in with the pumpkins the same way and lands near the front. Dark grey shaggy fur, chubby round body, paler belly, tiny stubby arms and feet, the same eyes and grin, two short horns. It says the line right after landing. Never use both.

    STYLE: Photorealistic phone footage, warm amber and purple Halloween grade, pumpkin glow the only new light, subtle film grain. Audio: the monster's one line and pumpkin thuds only. No text or watermark.
  negative_prompt: |-
    fur on object, limbs on object, new head on object, fluffy monster when an object is available, animal turned into monster, pet with horns, scary monster, sharp fangs, lips on monster, human lips, sparkly eyes, glittering pupils, star-shaped highlights, person speaking, person lips moving, off-screen voice, cobweb, spider web, cartoon, illustration, CGI, plastic pumpkins, googly eyes, sticker eyes, face distortion, changed facial features, different person, laughing, extra people, camera zoom, camera movement, new objects, broken pumpkin, pumpkins falling from above, pumpkins fading in, uncarved pumpkins, purple light source, text, watermark
  design_link: https://docs.google.com/presentation/d/1V67mCfG3uKFvdbqosfqvjhkzPRUZx0HaoV-a20skf9g/edit?slide=id.g3fbca53ae82_1_104#slide=id.g3fbca53ae82_1_104
  source_video_link: 
  reference_folder: ''
  use_comparison_template: false
  concurrent_requests: 3

# Comments and documentation
comments:
  output_directory: |
    Optional: Global output directory for all generated PPTX files.
    Can be overridden per task. Default is current directory.
  testbed: |
    Kling testbed endpoint used for video generation API calls.
  model_version: |
    Model version to use for video generation.
    Options: 'v1.6', 'v1.5', 'v2.0-master', 'v2.1', 'v2.1-master', 'v2.5-turbo', 'v2.6', 'v3'
    Default: 'v2.1' if not specified.
    Can be set globally or per-task.
  mode: |
    Generation mode for video quality.
    Options: 'std' (standard, faster) or 'pro' (professional, higher quality)
    Default: 'std'
  duration: |
    Video duration in seconds.
    Options: 5, 10
    Default: 5
  cfg: |
    CFG scale (Classifier Free Guidance).
    Range: 0.0 - 1.0
    Higher values = more adherence to prompt, less creative freedom.
    Default: 0.5
  prompt: |
    Text description of desired video motion and content.
    Should describe the action, movement, and visual style.
  negative_prompt: |
    Elements to avoid in the generated video.
    Helps prevent unwanted artifacts or style elements.
  design_link: |
    URL to design reference document (e.g., Google Slides, Figma).
    Used for report generation and reference.
  source_video_link: |
    URL to source video files (e.g., OneDrive, Google Drive).
    Used for report generation and reference.
  reference_folder: |
    Path to folder containing reference images for comparison.
    Optional - used when use_comparison_template is true.
  use_comparison_template: |
    Set to true to use comparison_template_path (3 placeholders: source, reference, output).
    Set to false to use template_path (2 placeholders: source, output).
  group_tasks_by: |
    Set to 0 (or omit) to create individual reports per task.
    Set to N to group N tasks into one combined report.
    Example: with 8 tasks and group_tasks_by=4, creates 2 reports.
  schedule: |
    start_time: HH:MM (24-hour format). Leave empty to start immediately.
    Allows delayed start for batch processing.
  folder_structure: |
    Each task folder should have 'Source', 'Generated_Video', and 'Metadata' subfolders.
    Source folder contains input images to be animated.

