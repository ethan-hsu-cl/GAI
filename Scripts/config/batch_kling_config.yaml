- mode: pro
  duration: 5
  cfg: 0.5
  sound_enabled: true
  resolution: 720p
  folder: Media Files/Kling 3.0/0924 6 Styles/掉進後室
  prompt: |-
    [0-1.2s] The person is already alive and moving from the very first frame, in the same pose and place as the input image. Ordinary casual movement — natural breathing, a shift of weight, the head and gaze turning, hair and clothing responding, the background drifting slightly with the handheld motion. Calm, ordinary and completely uneventful.

    [1.2-1.5s] In a single instant the floor beneath them opens and they drop through it at the same moment, with no warning. They descend straight down quickly, arms and legs drawn in close to the body, the head and shoulders passing below the floor line almost immediately, with strong motion blur across the body. The camera drops with them in the same instant.

    [1.5-2.1s] The bright room above shrinks away and the frame fills with darkness, tumbling camera movement and fast rushing motion blur. Nothing can be read in the frame.

    [2.1-2.6s] The descent ends. They arrive on a soft damp carpeted floor inside a long Backrooms corridor, coming down onto their front and settling onto their chest, shoulder and hip, the carpet absorbing the landing. The camera settles with a small bounce. They are unhurt.

    [2.6-5s] The person stays resting on their front on the carpet in exactly the position they arrived in, in the same spot, for the rest of the shot. Their chest, stomach, hips and legs stay against the floor. Only the head, shoulders and hands move. They lift their head and look around, awake and puzzled, eyebrows raised, blinking slowly as they take in the empty corridor, catching their breath calmly. They turn their head slowly to one side, then look back over their shoulder down the corridor with quiet curiosity. The shot ends with them still resting there, alone in the long empty hallway, looking around.
