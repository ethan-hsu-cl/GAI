  reference_folder: ''
  use_comparison_template: false
  concurrent_requests: 3

- mode: pro
  duration: 10
  cfg: 0.5
  sound_enabled: true
  resolution: 720p
  folder: Media Files/Kling 3.0/1002 3 Style/靈魂出竅 V5
  prompt: |-
    Static camera, no camera movement, same framing and background as the input image.

    0-3s: The person slowly closes their eyes and falls asleep in place. Their head drops low, tilting heavily forward and to one side, chin toward the chest. The sleeping person keeps their own head attached, with their face and hair fully visible, and stays solid, opaque and in full color in every frame until the end.

    3-7s: A translucent soul gently rises up from BEHIND the sleeping person's back and shoulders, drifting upward behind them. The soul has its OWN separate head, which appears in the empty space above and behind the sleeping person's shoulders, NOT at the sleeping person's head position. The sleeping person's head stays where it is, drooped to the side, and is never pulled, lifted, erased or replaced. As the soul rises, its hair hangs naturally in exactly the same shape as in the input image.

    7-10s: The soul straightens up behind and above the sleeping person, opens its eyes and calmly looks at the camera. In the final frame there are two heads and two faces: the sleeping person's solid head drooping in front and lower down, and the soul's translucent head upright, behind and higher up.

    The soul is a faded, translucent copy of the same person, like a photo overlaid at 60% opacity, with a thin soft edge line. It has the same face as the input image.

    HAIR: the soul's hairstyle is copied exactly from the input image: the same hair color, length, volume, parting and bangs, hanging in the same places around the face and over the shoulders as in the input image. The hair keeps its original color.

    CLOTHING: the soul is fully clothed in the exact same outfit as the input image: same garments, same color, same neckline height and sleeve length, covering the same areas as in the input image. Dark clothes stay dark and clearly visible. The whole figure fades as one layer, and the clothes always stay on and clearly visible.

    Out-of-body experience, spirit rising from behind the body, cinematic realism.
  negative_prompt: |-
    headless body, missing head, head disappearing, head removed, head pulled out, empty collar, neck hole, soul head in the same position as the body head, only one head, only one person, body fading, body turning into ghost, body replaced, shirtless, topless, exposed skin, see-through clothing, different clothing, different hairstyle, different face, face morphing, opaque soul, glowing chest light, sitting down, falling, collapsing, smoke, camera movement, zoom, scene change, cartoon, blurry, flicker
  design_link: https://docs.google.com/presentation/d/1V67mCfG3uKFvdbqosfqvjhkzPRUZx0HaoV-a20skf9g/edit?slide=id.h36c6af42793a73fa_26_0#slide=id.h36c6af42793a73fa_26_0
  source_video_link: 
  reference_folder: ''
  use_comparison_template: false
  concurrent_requests: 3

