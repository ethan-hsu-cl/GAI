  prompt: |-
    A 7-second uncut take from the uploaded photo as first frame — same person, face, hair, clothing, location and framing, camera static, no pan, tilt or zoom. A stylised neon light-art fashion effect. 0-1.5s: the person walks slowly toward the camera with heavy loose steps, arms slack, head low — tired and drained but a smooth walk, never a stagger. The ambient light begins falling away. 1.5-4.5s: the scene settles into dim dusk, same location, nothing added or removed, only darker and cooler, the person still clearly visible, walking forward, growing larger in frame. A faint hot-pink glow appears deep in the chest, then spreads along the spine, into the ribcage, down into the pelvis and out through the arms and legs, brightening smoothly, never switching on suddenly. Both eyes begin glowing the same hot pink, strengthening with the bones. The skin cools and pales. 4.5-5.5s: they slow, stop and settle into a slouched contrapposto — weight on one leg, that hip pushed out, the other knee soft and forward, shoulders slumped and uneven, head tilted, chin down, arms hanging heavy. Languid and drained but a deliberate pose. The skeleton hits full brightness at the same moment. 5.5-7s: they hold the pose, only breathing, fabric and hair settling; skeleton and eyes stay fully lit, pulsing faintly with the breath, never fading. The glow is INSIDE the body: a hot-pink neon drawing of the bones within the person, seen through skin and clothing as if lit from inside, anatomically correct and perfectly aligned with the pose every frame — spine along the curve of the back, ribcage in the chest, pelvis at the hips, arm and leg bones in the limbs — bending and swinging exactly with each limb, locked inside the body throughout. It never slides, lags or drifts out of alignment, is never pasted on the body, never floats beside it, never a flat shape in front of the clothing. The eyes glow the same hot pink from within, two soft pink lights blooming onto the skin, never going dark or returning to normal. Colour: saturated hot pink and magenta like neon tubing, soft bloom into skin and fabric; skin pale, cool porcelain, almost white but still natural with texture; clothing keeping its shape and material with a pink cast where light passes through; faint pink light spilling onto the ground and moving with them. One person only, alive and breathing. Style: photorealistic fashion editorial, neon light art, dim dusk, soft bloom, shallow depth of field, grain. No text or watermark.
