  folder: Media Files/Kling 3.0/0924 6 Styles/變身-殭屍
  prompt: |-
    An 8-second continuous shot using the uploaded photo as reference and first frame — same person, pose, clothing and environment, no new objects or people, the person staying in one spot. A practical special-effects makeup transformation for a Halloween horror film. 0-1.5s: every area of visible skin — face, neck, chest, shoulders, arms, hands — drains together, evenly and at the same rate, into one uniform desaturated grey-green corpse tone, so no area keeps its original warm colour and no patch differs in tone from the rest. Within that same grey palette the eye sockets sink into hollow bruised shadows with no hard edge, reading as sunken bone rather than eyeshadow painted onto normal skin — never purple, never a separate colour, never a mask-like patch. The irises cloud into milky white contact lenses, the gaze blank. 1.5-3s: the head tilts far to one side into an exaggerated broken-doll angle and holds there, jaw slack. 3-4.5s: one shoulder rolls inward and down into a crooked stance, that hand curling into a rigid claw, while many small thin dark-red scratches scatter unevenly across the shoulders, collarbone and upper arms — each short, narrow, muted and low in saturation, edges blended into the grey skin, never one large bright red slab and never a flat painted shape. 4.5-5.5s: the head tips the other way into a second broken angle while dark grey-green veining creeps up the neck to the jaw and temples, the same tone as the skin but deeper. 5.5-6.5s: the mouth falls open wide and dark red stage blood wells at one corner and runs slowly down the chin in a thin dripping thread. 6.5-7s: the shoulder seam frays open from the crooked pose, the skin beneath the same grey tone, the clothing keeping its original colour, style and coverage everywhere else. 7-8s: the figure snaps upright, head still at its broken angle, mouth stretched wide in a snarl showing teeth, both hands raised into forward-reaching claws, and charges at the camera in a fast stiff shambling run, hair and blood flying. Camera locked at eye level, static, matching the reference framing to 7s; at 7s it whips into a handheld first-person retreat, backing away fast, shaking hard, the figure nearly filling the frame by 8s. All makeup reads as one seamless full-body transformation with no colour mismatch between face, neck and body. Audio: rasping breathing, a creak at each tilt, wet dripping, a guttural roar at 7s, running footsteps. No text, no subtitles, no music.
