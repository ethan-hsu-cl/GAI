  prompt: |-
    A 10-second continuous take from the uploaded photo as first frame — camera locked, static, no zoom, pan, shake or cuts. The room, furniture and curtains stay exactly as in the reference. 0-1.5s: the person stays inside the TV screen, palms flat on the glass, looking out at the camera, faint static flickering. 1.5-3s: they press harder and their hands begin passing through the flat plane of the screen. The glass stays flat and rigid, nothing lights up where the hands cross. 3-5.5s: their hands come fully out, then their forearms, gripping the outer edges of the TV frame. 5.5-8s: head and shoulders push out through the screen plane, leaning out from the waist up, hands braced on the frame, upper body softly lit by the screen glow, lower half still inside the image. They pause, look around the dark room, then straight at the camera. 8-10s: still leaning half out, they smile and raise one hand in a friendly wave to the final frame. THE SCREEN STAYS A FLAT RECTANGLE: normal rectangular shape with slightly rounded CRT corners throughout — never a circle, an oval or an opening, never changing shape or size, brightness even across it, never concentrating into a bright shape or edge. The glass stays perfectly flat and rigid, never bulging, stretching, deforming or behaving like thin plastic, cling film or rubber; nothing clings to the body, wraps around it or is pulled out with it. The body passes straight through as if it weren't there. Where the body crosses the screen plane there is no ring, halo, glowing outline, bright rim, circle or arc of light of any kind — the crossing point is invisible, the body simply continuing from inside to outside with nothing drawn at the boundary, and no bright shape ever appears around the person. THE ROOM STAYS DARK: exactly as dark as the reference  ceiling light off, curtains drawn, the screen the only light source, corners and ceiling in deep shadow, never brightening. The person's face, hair, clothing and every detail stay exactly as in the reference, the same individual, never replaced. They stay calm and unthreatening  natural skin, normal eyes, relaxed expression; the eeriness comes from the dark room, never from them. They never climb fully out, staying half in and half out, moving like someone leaning out of a window. Style: photorealistic, cinematic, desaturated grey,faint green and cold blue, crushed shadows, the screen the only light accent, quiet Japanese horror, warm ending beat, film grain. No text or watermark.
