  directory: /Users/ethanhsu/Desktop/ethan-hsu-cl/GAI/Report
  group_tasks_by: 2

generation_count: 1

root_folder: Media Files/Wan V3 V2V

testbed: http://192.168.31.161/external-testbed/video_effect/
root_design_link: https://docs.google.com/presentation/d/1V67mCfG3uKFvdbqosfqvjhkzPRUZx0HaoV-a20skf9g/edit?slide=id.g409e32ca999_190_95#slide=id.g409e32ca999_190_95
root_source_video_link: https://cyberlinkcorp-my.sharepoint.com/:f:/g/personal/onedrive_qa1_cyberlink_com/IgCntj1i-QsFSLmzd1-uS0xWAWEwrZPSthqmNC5ka9XKI2w?e=Oq6Wc6

