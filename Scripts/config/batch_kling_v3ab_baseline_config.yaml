comments:
  model_version: |
    Model version to use for video generation.
    Options: 'v1.6', 'v1.5', 'v2.0-master', 'v2.1', 'v2.1-master', 'v2.5-turbo', 'v2.6', 'v3'
    Set globally at the root, or per-task to override the root value — the per-task
    override is what lets one baseline run mix v2.1 and v1.6 prompts.
  mode: |
    Generation mode: 'std' (faster) or 'pro' (higher quality).
    Must match between the baseline and v3 configs — the model version is
    the only variable this benchmark is meant to change.
  duration: |
    Video duration in seconds: 5 or 10. Keep identical across both configs.
  cfg: |
    CFG scale, 0.0 - 1.0. Note: the Kling handler currently sends a fixed 0.5,
    so this field is recorded in metadata but does not change the request.
  resolution: |
    Output resolution, e.g. '720p' or '1080p'. Keep identical across both configs.
  prompt: |
    Positive prompt — the text before #CL_PROMPT_BOUNDARY# in the source prompt sheet.
  negative_prompt: |
    Negative prompt — the text after #CL_PROMPT_BOUNDARY# in the source prompt
    sheet. Empty for prompts that ship without a boundary marker.
  folder: |
    Task folder holding 'Source', 'Generated_Video' and 'Metadata'.
    Source images must be byte-identical between the baseline folder and the
    v3 folder — the report matches the two sides by source-image filename.
  purpose: |
    Baseline (control) side of the Kling v3 A/B benchmark: the 10 prompts run on
    the model version each one currently ships with. Run this with the 'process'
    action only — the deck is produced by batch_kling_v3ab_config.yaml, which
    points its reference_folder at these output folders.

      python core/runall.py kling process --config config/batch_kling_v3ab_baseline_config.yaml
  usage: |
    Root model_version is v2.1; the three v1.6 prompts (Example_008_Elegance,
    Example_004_High-Five, Example_011_Fighting) carry a per-task model_version
    override, so all 10 baselines finish in a single run.
