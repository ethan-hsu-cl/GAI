      scale to each other; nothing about them is re-scaled, warped, morphed, or repositioned by the animation.

      Standing figure: slowly shifts weight onto one leg, one hand slides casually into a pocket or rests at the hip while the other arm hangs relaxed at the side. Chin lifts slightly, shoulders roll back into a confident stance. Head turns slowly toward the camera with a cool, composed
      expression — a faint, restrained half-smile at most. Feet stay planted, no stepping.

      Seated figure: subtly straightens posture, one hand rests elegantly on the lap or thigh while the other adjusts to a poised position — on the seat edge, on the knee, or brushing a strand of hair back. Legs stay crossed or in their original position. Head tilts slightly and turns toward the camera
      with a quiet, aloof gaze, chin lifted just enough to read as confident. Body stays seated in place.

      Both movements are small, slow and restrained — quiet grace, not busy motion. No physical contact, no leaning toward each other; each holds their
      own space with composed independence. Flowing fabric and loose strands of hair drift softly in a gentle breeze throughout.

      Mood & style: cold, refined, high-end elegance — the energy of a high-fashion editorial. Cool desaturated grade with steely blue and slate tones; crisp directional key light with a clean cool rim/hair light separating the subjects from a dim, minimal background; subtle filmic contrast, deep controlled shadows.

      Camera: a slow, sweeping cinematic orbit (circular dolly) arcing boldly around the two subjects — roughly a 180° half-turn — with wide, dramatic parallax as the dim background slides past behind them. It eases in gently, builds momentum through the middle of the arc, then eases out, combined with a very slight crane/boom rising from a low hero angle up to eye level. Both subjects stay centered and fully in frame the entire time. The camera travels through space while the subjects remain locked in place. Anamorphic widescreen feel, shallow depth of field; the cool rim light grazes their silhouettes as the angle changes. Smooth, unhurried, weighty motion —
