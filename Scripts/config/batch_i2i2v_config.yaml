      Create a realistic, elegant ancient Greek-inspired beauty portrait in front of grand classical Greek architecture with a wide Mediterranean coastal view. Include Greek ruins or temple-like elements such as marble columns, stone steps, or pale stone walls, but do not let stone architecture dominate the background. Most of the background must open into distant ocean, rich blue sea, open sky, or a coastal horizon. The image should feel bright, graceful, luxurious, timeless, and visually striking, like a high-end fashion editorial.

