      If the subject is female: dress her in a beautiful white or ivory ancient Greek gown such as a draped chiton, peplos, or Grecian one-shoulder / softly wrapped dress. Include refined gold details such as a gold belt, decorative shoulder clasp, gold trim, or a gold waist ornament. Add feminine gold jewelry and a delicate gold laurel crown or headpiece. Her hairstyle may be softly waved, braided, partially pinned up, or arranged in an elegant Greco-inspired updo, while still preserving her real hairstyle naturally. The overall look should feel graceful, regal, and goddess-like, but still realistic and tasteful.

      If the subject is male: dress him in a white or ivory ancient Greek outfit such as a draped chiton, tunic, or himation-style garment, with elegant layered fabric and classical structure. The outfit may include a draped shoulder cloth, wrapped waist detail, gold belt, subtle gold trim, gold arm cuffs, or a gold laurel crown. The styling should feel noble, heroic, and refined, with a clean classical silhouette rather than heavy armor.

      The pose is very important. Avoid stiff straight-standing poses. Each subject should appear relaxed, natural, graceful, and editorial. Use elegant, dynamic poses such as sitting on stone steps, leaning lightly against a marble column, resting one hand on a stone ledge, turning the body in a three-quarter angle, walking slowly through the ruins, looking into the distance, lightly touching jewelry or fabric, or shifting weight naturally. If multiple subjects are present, arrange them as a cohesive group portrait with varied but harmonious poses. Avoid making everyone stand in the same pose.

      Use flattering golden natural sunlight with a fixed luxury-editorial color treatment. The overall tone must be bright, clean, warm, polished, and professionally color-graded: creamy sunlit marble, ivory-white fabric, soft gold jewelry, rich Mediterranean blue sea, and a clearly visible gradient sky. The sky must have a beautiful, obvious, natural gradient instead of a flat single-color sky. It should transition smoothly from clear pale blue at the upper sky into warm golden peach, soft apricot, blush pink, or subtle lavender near the horizon. The gradient should be visually noticeable, elegant, luminous, and cinematic, like a refined Mediterranean sunset sky. Avoid gray, dull, cold, muddy, greenish, overly orange, flat blue, or phone-photo color.

      The subject / subjects must be clearly under sunlight. Part of the body must be visibly bathed in direct sun, and the face must also be directly touched by sunlight. Do not place the subject entirely in shade. At least part of the forehead, cheeks, nose bridge, and lips must be illuminated by real sunlight, creating a clear balance of sunlit highlights and soft shadows while keeping the facial features readable, recognizable, and naturally defined. Avoid lighting where the face is fully shaded, hidden by architectural shadow, or lit only by weak ambient bounce light.

      Add a subtle gentle breeze. The breeze should softly lift and move the flowing Greek fabric, draped edges, loose hair strands, ribbons, and small garment details in a natural, elegant way. The movement should feel light, graceful, and Mediterranean, adding life and atmosphere without making the pose messy or overly windy.

      The composition should feel like a premium high-fashion editorial portrait. Use an eye-level or slightly low-angle camera perspective only. Do not use a high-angle or top-down view. Use a long-lens / telephoto look for elegant compression, clean subject separation, and a refined premium-camera feel. The framing can be half-body, three-quarter body, or full-body depending on the pose, but the subject / subjects must remain visually dominant. Frame them with columns or ruins while keeping most of the background open to sea, sky, or coastal horizon. Avoid a background made entirely of pale stone surfaces.

      Keep the final image realistic, high-quality, and naturally photographed. Preserve believable anatomy, realistic fabric draping, natural hands, proper interaction with the environment, and clear subject identity. Avoid cartoon style, fantasy exaggeration, modern clothing, modern accessories, messy background, extra people, distorted hands, awkward posture, text, logos, or watermarks. The final result should feel like an elegant ancient Greek-inspired editorial portrait of the uploaded person / people, beautifully posed among classical ruins, wearing mandatory gold accessories, bathed in golden sunlight, with a clear Mediterranean sea backdrop and a vivid gradient sky.

    video_model: v3
    video_mode: pro
    video_duration: 5
