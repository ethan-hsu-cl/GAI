# Image-to-Image-to-Video Batch Configuration
#
# Two-step pipeline per source image:
#   1. Image generation via /nano_banana OR /openai_image (chosen per task)
#   2. Video generation via Kling /Image2Video using the generated image
#
# Folder layout per task:
#   {folder}/
#   ├── Source/             # input reference images
#   ├── Generated_Frames/   # intermediate generated images (reused on resume)
#   ├── Generated_Video/    # final mp4 videos
#   └── Metadata/


output:
  group_tasks_by: 3

testbed: '{testbed}/image_generation/'

schedule:
  start_time: ''

root_design_link: https://docs.google.com/presentation/d/17up-p5BoTa8ZpafQfV--H4PQKHNTaVur_b33EdM445Y/edit?slide=id.h2c9de0104c757660_0_9#slide=id.h2c9de0104c757660_0_9
root_source_video_link: 

# Reuse original i2i frames (video-only). If a task folder contains a dropped-in
# original-run folder, the handler stages a subset before processing (applied
# automatically by runall). See the reuse_original_* notes in comments: below.
reuse_original_frames: false
reuse_original_limit: 25
reuse_original_seed: 42
reuse_original_reset: false

# Global image-source selection defaults. Individual tasks can override any key.
use_random_source_selection: false
min_images: 2
max_images: 2
num_iterations: 25
use_deterministic_random: true
random_seed: 42
video_resolution: '720p'

tasks:

  - style_name: '把自己變聖誕吊飾'
    folder: 'Media Files/I2I2V/1110 3 Styles/把自己變聖誕吊飾'
    image_service: nano_banana
    image_model: gemini-nano-banana-2.1
    image_quality: auto
    image_resolution: '1K'
    image_aspect_ratio: '9:16'
    image_prompt: |
      Use the person in the attached photo. Turn them into a glossy hand-painted glass Christmas ornament figurine that clearly looks like them: same face shape, hairstyle, hair color, skin tone, glasses if any, and the same outfit they wear in the photo, simplified as painted glass. Do not beautify.

      Vertical 9:16 photo. The figurine hangs on a thin gold string from a Christmas tree branch, full body, facing the camera, arms relaxed at the sides. The whole figurine is in the frame from the gold cap down to its shoes, with a little empty space below the feet; if the photo does not show their legs or shoes, complete the outfit with matching trousers or skirt and shoes. Shiny lacquered surface with soft highlights, a small gold cap on the head. Background: pine branches and warm golden bokeh of tree lights. No text, no logo.

    video_service: kling
    video_model: v3
    video_mode: pro
    video_resolution: '720p'
    video_duration: 10
    video_ratio: 'auto'
    video_sound_enabled: true
    video_prompt: |
      Static camera with a very slow push-in. The figurine slowly rotates on its string to one side, then slowly rotates back to face the camera. Its arms stay still in the same pose; no waving. Glossy highlights slide across its lacquered surface. The tree lights twinkle softly. It stays hanging on the string and keeps its shape and size.

    video_negative_prompt: 'text, letters, watermark, logo, timestamp, extra people, duplicate person, extra fingers, extra limbs, deformed hands, face distortion, face morphing, flicker, jitter, waving, raised hand'

    concurrent_requests: 3

  - style_name: '跟聖誕老人開趴'
    folder: 'Media Files/I2I2V/1110 3 Styles/跟聖誕老人開趴'
    image_service: nano_banana
    image_model: gemini-nano-banana-2.1
    image_quality: auto
    image_resolution: '1K'
    image_aspect_ratio: '9:16'
    image_prompt: |
      Use the reference photo for identity: the subject in this image is exactly the same person as in the reference photo, with the same face, facial features, skin tone, hair color and hairstyle, age and body type. Do not make her younger, do not change her ethnicity, do not change her hairstyle, do not beautify. If the reference photo shows an animal instead of a person, the subject is that same animal, with the same breed, fur colors and markings, wearing a small cozy red sweater, peeking out of the box with its front paws on the edge.

      Vertical 9:16 image. The person from the reference photo, photorealistic with real skin texture and her own hairstyle, wearing a cozy red sweater, is crouched inside one big gift box; only her head, shoulders and both hands showing as she grips the front edge of the box, peeking out with a mischievous excited grin, face toward the camera. Her face is clearly visible and recognizable. The gift box is a large cube of plain glossy solid red paper with no pattern, seen straight on with its front face parallel to the camera, and one flat gold satin ribbon band running straight down the middle of the front face; the box itself has no bow. There is exactly one lid: a matching square glossy red lid with a gold satin ribbon cross and a single big gold satin bow on top, resting directly on top of her head and touching her hair, tilted back like a half-opened lid with its front edge on her head and its back edge lifted; the lid is not floating in the air. This bow on the lid is the only bow in the whole picture. The box sits on the floor in front of a decorated Christmas tree in a warm living room; there are no other real gift boxes or bows around it. Out of the gap under the lid, playful stylized 3D cartoon props are starting to burst out: candy canes, a smiling gingerbread man, glossy gold stars, curly ribbons, mini presents and sparkles, rendered in a bright Pixar-like 3D cartoon style with saturated colors, clearly contrasting with the realistic person. Bright, cheerful, high saturation. No text, no logo. She is the only person in the picture.

    video_service: kling
    video_model: v3
    video_mode: pro
    video_resolution: '720p'
    video_duration: 10
    video_ratio: 'auto'
    video_sound_enabled: true
    video_prompt: |
      A 10-second video of a person bursting out of a big gift box into a Christmas party. One continuous shot, the camera close in front of them. They pop up through the lid with both arms raised, cheering in a burst of gold confetti, then a golden blast sweeps across the room and turns it into a huge party with disco balls, colorful light beams and a cartoon Santa DJ. Bright 3D cartoon Santas, elves, reindeer and snowmen dance around them, while they stay photorealistic and dance and laugh right in front of the camera.

    video_negative_prompt: 'text, letters, watermark, logo, timestamp, extra people, duplicate person, extra fingers, extra limbs, deformed hands, face distortion, face morphing, flicker, jitter, objects suddenly disappearing, a second Christmas tree, merged characters, hybrid creatures, fused bodies, elf with antlers, snowman with reindeer head, reindeer with elf hat, characters blending into each other,cartoon dog, cartoon pet, 3D animated animal, stylized pet, Pixar-style dog, plush toy dog'

    concurrent_requests: 3

  - style_name: '丟雪球'
    folder: 'Media Files/I2I2V/1110 3 Styles/丟雪球'
    image_service: nano_banana
    image_model: gemini-nano-banana-2.1
    image_quality: auto
    image_resolution: '1K'
    image_aspect_ratio: '9:16'
    image_prompt: |
      Use the reference photo for identity: the subject in this image is exactly the same person as in the reference photo, with the same face, facial features, skin tone, hair color and hairstyle, age and body type. Do not make her younger, do not change her ethnicity, do not change her hairstyle, do not beautify. Her face must be an exact match of the reference photo: the same face shape, jawline, chin, cheekbones, nose, lips, eyes and eyebrows, and her true natural skin tone; do not round, widen or slim her face, do not lighten or darken her skin, do not change her features to fit the style. The sunlight, haze and lens flare stay around her and must never cover or wash out her face: her face is evenly lit, in sharp focus and shows her true skin tone, and her own hair stays clearly visible below the beanie. If the reference photo shows an animal instead of a person, the subject is that same animal, photorealistic with real fur, with the same breed, fur colors and markings, wearing a small red knit beanie and playfully pawing at a snowball.

      Vertical 9:16 photo, eye level, medium shot. The person from the reference photo, photorealistic with real skin texture and her own hairstyle, in a black leather jacket with a cream-white shearling collar and shearling-lined cuffs, worn open over a black top, a chunky red wool scarf wrapped loosely around her neck, a red knit beanie and red mittens, stands in a wide open snowfield in the late afternoon, her body and shoulders turned toward the camera, square to the lens, facing the camera and laughing, her right arm pulled back about to throw a snowball straight at the camera, the snowball held in her mitten. Behind her: a wide, flat, untouched snowfield like a frozen lake, stretching back to a long line of tall bare winter trees and dark pine trees along the far edge, under a pale bright sky; no buildings, no houses, no fences, no decorations at all. Dreamy cinematic film look, strongly backlit: the low winter sun is visible in the frame just behind her shoulder, shining straight toward the camera, creating a large warm lens flare with soft orange-pink flare orbs and a hazy halation glow that washes over the image; her hair and the edges of her jacket glow with a bright golden rim light, and her face is softly lit by light bouncing off the snow and stays clearly visible and recognizable; light snow drifts through the sunlight. Heavily overexposed, washed-out, hazy image like an old film photo shot straight into the sun: very low contrast, a milky white haze veiling the whole frame, faded lifted shadows with no deep blacks, soft pale desaturated colors (whitish blue sky, glowing white snow, warm golden highlights in the air), slightly soft focus and shallow depth of field, visible 35mm film grain, real skin texture. No text, no logo.

    video_service: kling
    video_model: v3
    video_mode: pro
    video_resolution: '720p'
    video_duration: 10
    video_ratio: 'auto'
    video_sound_enabled: true
    video_prompt: |
      A 10-second video of a person having a snowball fight with the camera in a sunny snowfield, throwing at the lens and then getting hit back. Handheld camera at eye level, facing them the whole time. They throw a snowball straight at the lens; it hits, the camera shakes in a burst of snow, then clears. The camera holder's gloved hand throws one back from the bottom of the frame, and it bursts on the chest of their puffer jacket. They laugh, bend down, scoop snow from the ground, press it into a new snowball and throw it at the camera again. They face the camera and laugh the whole time.

    video_negative_prompt: 'text, letters, watermark, logo, timestamp, extra people, duplicate person, extra fingers, extra limbs, deformed hands, face distortion, face morphing, flicker, jitter, floating sheet, sheet hovering in the air, changing outfit, different person, another person''s face or body, a second full person, turning her back to the camera, face turned away from the camera, throwing to the side, throwing sideways, snowball thrown upward into the sky'

    concurrent_requests: 3


comments:
  example: |
    nano_banana variant (alternative to the openai_image task above):
      - style_name: 看球賽 (nano)
        folder: Media Files/I2I2V/0520 看球賽 nano
        image_service: nano_banana
        image_model: gemini-3.1-flash-image
        image_resolution: '1K'
        image_aspect_ratio: '16:9'
        image_prompt: |
          ...
        video_model: v3
        video_mode: pro
        video_duration: 5
        video_prompt: |
          ...
        video_negative_prompt: ''

  example_multi_image: |
    Multi-image pairing (Source image + one Additional image per call):
      - style_name: 熱門雙人拍貼-雪洞
        folder: Media Files/I2I2V/0717 11 Styles/0717 熱門雙人拍貼-雪洞
        image_service: nano_banana
        image_model: gemini-3-pro-image
        image_resolution: '1K'
        image_aspect_ratio: '3:4'
        image_prompt: |
          ...
        use_multi_image: true
        multi_image_config:
          mode: sequential            # or random_pairing
          # folders default to <folder>/Additional
        video_model: v3
        video_mode: pro
        video_duration: 5
        video_ratio: '3:4'
        video_prompt: |
          ...
        video_negative_prompt: ''

  example_random_source: |
    Random source selection (N Source images per call, iterated):
      - style_name: <style>
        folder: Media Files/I2I2V/0717 11 Styles/0717 <style>
        image_service: nano_banana
        image_model: gemini-3-pro-image
        image_resolution: '1K'
        image_aspect_ratio: '3:4'
        image_prompt: |
          ...
        use_random_source_selection: true
        min_images: 1
        max_images: 3
        num_iterations: 50
        use_deterministic_random: true
        random_seed: 42
        video_model: v3
        video_mode: pro
        video_duration: 5
        video_ratio: '3:4'
        video_prompt: |
          ...
        video_negative_prompt: ''

  pipeline: |
    Per source image, the handler runs two API calls:
      1. Image generation via the testbed at `testbed` (default: image_generation),
         using either /nano_banana or /openai_image based on `image_service`.
      2. Video generation with the freshly generated image, via whichever
         backend `video_service` selects:
           - kling  → the Kling testbed (kling_endpoint), /Image2Video
           - wan_v3 → the video_effect testbed (wan_endpoint), /wan_v3 with the
                      generated image sent as first_frame

  resume_behaviour: |
    If `Generated_Frames/{source_name}_image.{ext}` exists from a prior run,
    the image step is skipped and the existing image is fed to the video
    service directly.
    Delete the frame to force a re-generation.

    Video-only reuse: to run Kling on i2i frames from an earlier run (e.g.
    frames produced by the Nano multi-generation pipeline), place them in
    `Generated_Frames/` named `{source_name}_image.{ext}` with a matching
    `Source/` entry per frame. The `reuse_original_*` options below do this
    automatically (see `Scripts/handlers/i2i2v_handler.py`).

  reuse_original_frames: |
    Root-level. When true (default), before processing each task the handler
    stages any dropped-in original-run folder inside the task folder — a
    subdirectory containing a `Generated_Output/` folder (the Nano
    multi-generation layout). It copies Generated_Output → Generated_Frames
    and the matching Source photo per frame, so the run reuses the i2i frames
    and only renders Kling videos with the new video prompts. This runs
    automatically under runall. A no-op when no original-run folder is present;
    set false to disable entirely.

  reuse_original_limit: |
    Root-level. How many generated outputs to stage per task (i.e. how many
    videos the reuse run produces). null / absent = all. Sampled with a
    per-task seeded RNG so the same subset is chosen every run. To shrink an
    already-staged task, also set reuse_original_reset: true for one run.

  reuse_original_seed: |
    Root-level. Seed for the reproducible subset sampling (default: 42).

  reuse_original_reset: |
    Root-level. When true, clears each task's staged Source / Additional /
    Generated_Frames / Original_Source before staging (the dropped-in
    original-run folder is never touched). Use to re-stage at a different
    limit. Leave false for normal resumable runs — it does NOT touch
    Generated_Video or Metadata, so completed videos are still skipped.

  image_step_modes: |
    The image-generation step (skipped when a frame already exists) supports
    the same multi-image and random-source modes as the standalone image APIs.
    Random-source fields can be set at the config root as global defaults or
    overridden per task. Omit them for the one-source-image-per-video pipeline.

  use_multi_image: |
    Set true to pair each Source image with one image per folder in
    `multi_image_config.folders` (defaults to the task's `Additional/`
    folder). Sequential mode pairs by sorted source index; random_pairing
    picks at random. Total images per call are capped by the model limit
    (gemini-3*: 14, flash: 3, gpt-image*: 10).

  multi_image_config: |
    Optional. Keys:
      mode:    sequential (default) | random_pairing
      folders: list of folders to draw one additional image from each
               (default: ['<task folder>/Additional'])

  use_random_source_selection: |
    Set true to switch the task to iteration mode: each iteration picks
    min_images–max_images images from the Source folder (reused across
    iterations), runs image-gen on them → one frame → one Kling video, named
    iterNNN_<sources>. Selection is reproducible for a fixed Source folder.
    Related keys:
      min_images / max_images:   images per call (clamped to model max)
      num_iterations:            API-call count (default: # source files)
      use_deterministic_random:  true = seeded shuffle, false = sorted order
      random_seed:               seed for deterministic_random (default: 42)

  image_service: |
    Per-task selection of which image API to use.
    Options:
      - nano_banana   → Google Gemini Flash / Pro image models
      - openai_image  → OpenAI gpt-image-* models

  image_model: |
    nano_banana options:
      - gemini-2.5-flash-image
      - gemini-3-pro-image
      - gemini-3.1-flash-image (default for nano_banana)
    openai_image options:
      - gpt-image-1
      - gpt-image-1-mini
      - gpt-image-1.5
      - gpt-image-2 (default for openai_image)
      - gpt-image-2.5-flare
      - gpt-image-2.5-sunburst

  image_quality: |
    openai_image only.  Options: auto | low | medium | high.  Ignored for nano_banana.

  image_aspect_ratio: |
    Valid options: auto, 1:1, 2:3, 3:2, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 21:9.

  video_service: |
    Which backend renders the video from the generated frame.
    Options: kling (default) | wan_v3.
    The two take different parameters — a field belonging to the other service
    is ignored, so check this first when a setting seems to have no effect.
      kling  : video_model, video_mode, video_negative_prompt, video_sound_enabled
      wan_v3 : video_ratio, video_audio_out, video_duration_auto, video_thinking
      both   : video_prompt, video_duration, video_resolution

  video_model: |
    kling only. Options: v1.6, v1.5, v2.0-master, v2.1, v2.1-master,
    v2.5-turbo, v2.6, v3 (default). Ignored when video_service is wan_v3.

  video_mode: |
    kling only. Generation mode. Options: std | pro (default).

  video_duration: |
    Video duration in seconds.
    kling options: 5, 10 (default 5). wan_v3 takes any integer duration.

  video_resolution: |
    Output resolution. kling options: 720p | 1080p (default 720p).
    wan_v3 options: 480P | 720P | 1080P (default 720P); the value is
    upper-cased before it is sent, so '720p' works for either service.

  video_ratio: |
    wan_v3 only. Output aspect ratio; 'adaptive' follows the generated frame.
    Options: 16:9, 9:16, 1:1, 4:3, 3:4, adaptive (default).
    Ignored when video_service is kling.

  video_negative_prompt: |
    kling only. /wan_v3 accepts no negative prompt — if one is set on a wan_v3
    task the handler logs a warning and drops it rather than folding it into
    the positive prompt.

  video_sound_enabled: |
    kling only. Whether Kling generates sound for the video.
    Options: true | false. Default: true.

  video_audio_out: |
    wan_v3 only. Generate an audio track with the video. Default: true.

  video_duration_auto: |
    wan_v3 only. Let the model pick the duration instead of using
    video_duration. Default: false.

  video_thinking: |
    wan_v3 only. Enable the endpoint's prompt reasoning pass before
    generating. Default: false.

  concurrent_requests: |
    Shared parallelism cap for both stages (per task, or root-level for all
    tasks). Default: 1 (serial prefetch pipeline). When > 1 (or when a per-stage
    override below is > 1), the handler runs a two-phase concurrent pipeline:
    Phase 1 generates all intermediate frames in parallel, Phase 2 renders all
    videos in parallel. Capped at MAX_CONCURRENT_REQUESTS (10).

  image_concurrency: |
    Optional per-stage override for Phase 1 (image-gen) parallelism. The image
    testbed typically tolerates more concurrency than the Kling video testbed,
    so this can be set higher than video_concurrency. Falls back to
    concurrent_requests, then 1. Capped at 10.

  video_concurrency: |
    Optional per-stage override for Phase 2 (Kling video-gen) parallelism.
    Falls back to concurrent_requests, then 1. Capped at 10.

  output_naming: |
    Intermediate frame:  {source_name}_image.{ext}   in Generated_Frames/
    Final video:          {source_name}.mp4           in Generated_Video/
    Metadata:             {source_name}_metadata.json in Metadata/

