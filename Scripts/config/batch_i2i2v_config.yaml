        video_prompt: |
          ...
        video_negative_prompt: ''

  pipeline: |
    Per source image, the handler runs two API calls:
      1. Image generation via the testbed at `testbed` (default: image_generation),
         using either /nano_banana or /openai_image based on `image_service`.
      2. Video generation with the freshly generated image, via whichever
         backend `video_service` selects:
           - kling  → the Kling testbed (kling_endpoint), /Image2Video
           - wan_v3 → the video_effect testbed (wan_endpoint), /wan_v3 with the
                      generated image sent as first_frame

  resume_behaviour: |
    If `Generated_Frames/{source_name}_image.{ext}` exists from a prior run,
    the image step is skipped and the existing image is fed to the video
    service directly.
    Delete the frame to force a re-generation.

    Video-only reuse: to run Kling on i2i frames from an earlier run (e.g.
    frames produced by the Nano multi-generation pipeline), place them in
    `Generated_Frames/` named `{source_name}_image.{ext}` with a matching
    `Source/` entry per frame. The `reuse_original_*` options below do this
    automatically (see `Scripts/handlers/i2i2v_handler.py`).

  reuse_original_frames: |
    Root-level. When true (default), before processing each task the handler
    stages any dropped-in original-run folder inside the task folder — a
    subdirectory containing a `Generated_Output/` folder (the Nano
    multi-generation layout). It copies Generated_Output → Generated_Frames
    and the matching Source photo per frame, so the run reuses the i2i frames
    and only renders Kling videos with the new video prompts. This runs
    automatically under runall. A no-op when no original-run folder is present;
    set false to disable entirely.

  reuse_original_limit: |
    Root-level. How many generated outputs to stage per task (i.e. how many
    videos the reuse run produces). null / absent = all. Sampled with a
    per-task seeded RNG so the same subset is chosen every run. To shrink an
    already-staged task, also set reuse_original_reset: true for one run.

  reuse_original_seed: |
    Root-level. Seed for the reproducible subset sampling (default: 42).

  reuse_original_reset: |
    Root-level. When true, clears each task's staged Source / Additional /
    Generated_Frames / Original_Source before staging (the dropped-in
    original-run folder is never touched). Use to re-stage at a different
    limit. Leave false for normal resumable runs — it does NOT touch
    Generated_Video or Metadata, so completed videos are still skipped.

  image_step_modes: |
    The image-generation step (skipped when a frame already exists) supports
    the same multi-image and random-source modes as the standalone image APIs.
    Random-source fields can be set at the config root as global defaults or
    overridden per task. Omit them for the one-source-image-per-video pipeline.

  use_multi_image: |
    Set true to pair each Source image with one image per folder in
    `multi_image_config.folders` (defaults to the task's `Additional/`
    folder). Sequential mode pairs by sorted source index; random_pairing
    picks at random. Total images per call are capped by the model limit
    (gemini-3*: 14, flash: 3, gpt-image*: 10).

  multi_image_config: |
    Optional. Keys:
      mode:    sequential (default) | random_pairing
      folders: list of folders to draw one additional image from each
               (default: ['<task folder>/Additional'])

  use_random_source_selection: |
    Set true to switch the task to iteration mode: each iteration picks
    min_images–max_images images from the Source folder (reused across
    iterations), runs image-gen on them → one frame → one Kling video, named
    iterNNN_<sources>. Selection is reproducible for a fixed Source folder.
    Related keys:
      min_images / max_images:   images per call (clamped to model max)
      num_iterations:            API-call count (default: # source files)
      use_deterministic_random:  true = seeded shuffle, false = sorted order
      random_seed:               seed for deterministic_random (default: 42)

  image_service: |
    Per-task selection of which image API to use.
    Options:
      - nano_banana   → Google Gemini Flash / Pro image models
      - openai_image  → OpenAI gpt-image-* models

  image_model: |
    nano_banana options:
      - gemini-2.5-flash-image
      - gemini-3-pro-image
      - gemini-3.1-flash-image (default for nano_banana)
    openai_image options:
      - gpt-image-1
      - gpt-image-1-mini
      - gpt-image-1.5
      - gpt-image-2 (default for openai_image)
      - gpt-image-2.5-flare
      - gpt-image-2.5-sunburst

  image_quality: |
    openai_image only.  Options: auto | low | medium | high.  Ignored for nano_banana.

  image_aspect_ratio: |
    Valid options: auto, 1:1, 2:3, 3:2, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 21:9.

  video_service: |
    Which backend renders the video from the generated frame.
    Options: kling (default) | wan_v3.
    The two take different parameters — a field belonging to the other service
    is ignored, so check this first when a setting seems to have no effect.
      kling  : video_model, video_mode, video_negative_prompt, video_sound_enabled
      wan_v3 : video_ratio, video_audio_out, video_duration_auto, video_thinking
      both   : video_prompt, video_duration, video_resolution

  video_model: |
    kling only. Options: v1.6, v1.5, v2.0-master, v2.1, v2.1-master,
    v2.5-turbo, v2.6, v3 (default). Ignored when video_service is wan_v3.

  video_mode: |
    kling only. Generation mode. Options: std | pro (default).

  video_duration: |
    Video duration in seconds.
    kling options: 5, 10 (default 5). wan_v3 takes any integer duration.

  video_resolution: |
    Output resolution. kling options: 720p | 1080p (default 720p).
    wan_v3 options: 480P | 720P | 1080P (default 720P); the value is
    upper-cased before it is sent, so '720p' works for either service.

  video_ratio: |
    wan_v3 only. Output aspect ratio; 'adaptive' follows the generated frame.
    Options: 16:9, 9:16, 1:1, 4:3, 3:4, adaptive (default).
    Ignored when video_service is kling.

  video_negative_prompt: |
    kling only. /wan_v3 accepts no negative prompt — if one is set on a wan_v3
    task the handler logs a warning and drops it rather than folding it into
    the positive prompt.

  video_sound_enabled: |
    kling only. Whether Kling generates sound for the video.
    Options: true | false. Default: true.

  video_audio_out: |
    wan_v3 only. Generate an audio track with the video. Default: true.

  video_duration_auto: |
    wan_v3 only. Let the model pick the duration instead of using
    video_duration. Default: false.

  video_thinking: |
    wan_v3 only. Enable the endpoint's prompt reasoning pass before
    generating. Default: false.

  concurrent_requests: |
    Shared parallelism cap for both stages (per task, or root-level for all
    tasks). Default: 1 (serial prefetch pipeline). When > 1 (or when a per-stage
    override below is > 1), the handler runs a two-phase concurrent pipeline:
    Phase 1 generates all intermediate frames in parallel, Phase 2 renders all
    videos in parallel. Capped at MAX_CONCURRENT_REQUESTS (10).

  image_concurrency: |
    Optional per-stage override for Phase 1 (image-gen) parallelism. The image
    testbed typically tolerates more concurrency than the Kling video testbed,
    so this can be set higher than video_concurrency. Falls back to
    concurrent_requests, then 1. Capped at 10.

  video_concurrency: |
    Optional per-stage override for Phase 2 (Kling video-gen) parallelism.
    Falls back to concurrent_requests, then 1. Capped at 10.

  output_naming: |
    Intermediate frame:  {source_name}_image.{ext}   in Generated_Frames/
    Final video:          {source_name}.mp4           in Generated_Video/
    Metadata:             {source_name}_metadata.json in Metadata/

