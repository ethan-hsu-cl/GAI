# Reuse original i2i frames (video-only). If a task folder contains a dropped-in
# original-run folder, the handler stages a subset before processing (applied
# automatically by runall). See the reuse_original_* notes in comments: below.
reuse_original_frames: false
reuse_original_limit: 25
reuse_original_seed: 42
reuse_original_reset: false

# Global image-source selection defaults. Individual tasks can override any key.
use_random_source_selection: false
min_images: 2
max_images: 2
num_iterations: 25
use_deterministic_random: true
random_seed: 42
video_resolution: '720p'

tasks:
  - style_name: Crawl_Out_Of_TV
    folder: Media Files/I2I2V/0921 1 Style/Crawl_Out_Of_TV
    image_service: openai_image
    image_model: gpt-image-2.5-sunburst
    image_quality: auto
    image_resolution: '1K'
    image_aspect_ratio: '1:1'
    image_prompt: |
      Use the uploaded photo as the reference for one specific real person.

      MOST IMPORTANT RULE: the person appearing on the television screen must be the exact same person as in the uploaded photo — identical face, facial structure, eyes, eyebrows, nose, mouth, skin tone, hairstyle, hair length and color, and the same clothing they are wearing in the photo. Do not change their gender, age, ethnicity, hairstyle, glasses, accessories or outfit. Do not invent a different person. Their face must be immediately recognizable as the same person when compared side by side with the uploaded photo.

      Generate a new square 1:1 photograph of an ordinary Japanese living room late at night. The room is dim, still and heavy with shadow. The ceiling light is switched off and its pull cord hangs motionless. Thin curtains are drawn over a window on the left, letting in only a faint cold blue-grey wash from outside. The television is the only real light source in the room. Deep shadow swallows the corners and the ceiling.

      The room feels quiet and slightly abandoned: worn cream-coloured walls with faint stains near the ceiling, a sliding paper screen door standing half open onto a black hallway, low wooden furniture, a fabric sofa at one edge with a folded blanket, a potted plant drooping slightly at the other edge, a few unlabeled VHS tapes stacked on the stand. Everything is tidy but lifeless, as if nobody has been in the room for a long time. No other people anywhere in the room.

      An old boxy CRT television with a deep body sits on a low wooden TV stand against the wall, centered and dominating the frame, the screen filling about 70% of the image width, facing the camera perfectly straight on. The bottom quarter of the frame is empty wooden floor with a patterned rug between the camera and the TV.

      The television is switched on. On the screen, the person from the uploaded photo appears from the waist up, facing the camera directly and filling most of the screen. They are pressed up close against the inside of the glass: both palms flat against the screen surface at shoulder height, fingers spread, leaning slightly forward, looking straight out at the camera with a calm, natural expression.

      THE PERSON ON SCREEN STAYS NORMAL AND UNTHREATENING: render them clearly and sharply in full natural color, with correct even exposure on the face, healthy natural skin tone and normal eyes, so every feature stays recognizable and they look like an ordinary living person. Their expression is calm and neutral. They are not pale, not grey, not distorted, not wounded, not hollow-eyed and not frightening in any way. Apply only a very light CRT look to them: faint horizontal scanlines and a subtle glow. Grainy static appears only in the background area around and behind them on the screen, never across their face or body. All of the eeriness comes from the dark room around the television, never from the person themselves.

      The lit screen is the strongest light in the frame and casts a cold blue-white glow forward across the wooden floor and the rug, throwing long soft shadows out toward the camera and lighting the nearest edges of the furniture while everything beyond it falls into darkness.

      Camera low, about knee height, static and straight on. Photorealistic, desaturated cool palette of grey, faint green and cold blue, deep crushed shadows, underexposed room with the bright screen as the only accent, quiet Japanese horror atmosphere, visible film grain, no text, no watermark.

    video_service: wan_v3
    video_resolution: '720P'
    video_ratio: '1:1'
    video_duration: 10
    video_audio_out: true
    video_prompt: |
      LOCKED: Continue the exact scene of the input image. Single continuous take, camera locked in the exact framing of the reference image, completely static — no zoom, no pan, no shake, no cuts. The room, the floor, the furniture, the curtains, the sliding door and the TV stand stay exactly as in the reference throughout. Total duration 10 seconds.

      NO RING AND NO GLOWING EDGE: where the body crosses the screen plane there is no ring, no halo, no glowing outline, no bright rim, no circle of light and no arc of light of any kind. The crossing point is completely invisible — the body simply continues from inside the screen to outside it with nothing drawn at the boundary at all. No bright shape ever appears around the person.

      THE SCREEN KEEPS ITS SHAPE: the television screen stays its normal rectangular shape with its normal slightly rounded CRT corners for the entire shot. It never becomes a circle, never becomes an oval, never opens into a hole and never changes shape or size. Its brightness stays even across the whole screen and never concentrates into a bright shape or a bright edge.

      NO MEMBRANE, NO STRETCHING: the screen surface never bulges, never stretches, never deforms and never behaves like a thin plastic film, cling film or rubber sheet. The glass stays perfectly flat and rigid at all times. The body passes straight through the flat plane of the screen as if the glass simply were not there. Nothing ever clings to the body, wraps around it or is pulled outward with it.

      THE ROOM STAYS DARK: the room stays exactly as dark as in the reference image for the whole shot. The ceiling light stays off, the curtains stay drawn, and the television screen remains the only real light source in the room. The corners, the ceiling and the open sliding door stay in deep shadow. The room never brightens, and no daylight and no new light source ever appears.

      LIGHTING ON THE PERSON: the parts of them still inside the screen stay lit as a television image. The parts that have come out into the room are lit only by the soft glow of the screen itself, spilling onto their arms, face and shoulders from below and behind, with the dark room falling away around them. They stay clearly visible and readable at all times.

      TIMELINE:

      [0-1.5s] The person stays inside the television screen, palms pressed flat against the glass, looking out at the camera. The screen's faint static flickers normally. Nothing else in the room moves.

      [1.5-3s] They press harder and their hands begin to pass through the flat plane of the screen. The glass itself stays completely flat, rectangular and rigid and does not move at all. Nothing lights up at the point where their hands cross.

      [3-5.5s] Their hands come fully out into the room, followed by their forearms, and they grip the outer edges of the television frame from outside. The screen behind them keeps its normal rectangular shape and its normal even brightness.

      [5.5-8s] Their head and shoulders push out through the screen plane into the room. They are now leaning out of the television from the waist up, hands braced on the TV frame, their upper body softly lit by the screen glow while their lower half is still inside the screen image. They pause, look slowly around the dark room, then look straight at the camera.

      [8-10s] Still leaning half out of the screen, they smile and raise one hand off the TV frame in a friendly wave toward the camera, holding it until the final frame.

      THROUGHOUT THE WHOLE SHOT:
      No ring, halo, glowing outline or bright rim ever appears anywhere around the person or around the screen.
      The screen stays rectangular with its normal even brightness at every moment and never becomes a circle, an oval or an opening.
      The screen glass stays flat and rigid at every moment and never deforms in any way.
      The person's face, hair, clothing and every physical detail stay exactly as they appear in the reference image at all times — the same individual throughout, with no change to their features, hairstyle or outfit as they emerge, and never replaced with a different person.
      They stay calm, healthy and unthreatening — natural skin tone, normal eyes, a relaxed expression. All of the eeriness comes from the dark room, never from the person.
      They do not climb all the way out — they stay half in, half out of the television for the whole shot.
      Movements are natural, relaxed and unhurried, like someone leaning out of a window.
      The room stays dark for the whole shot and the television stays the only light source.
      The camera never moves and there are no cuts.
      The image stays clean, with no text, captions, subtitles or watermark anywhere.

      Style: photorealistic, cinematic, desaturated cool palette of grey, faint green and cold blue, deep crushed shadows, the screen as the only light accent, quiet Japanese horror atmosphere with a warm friendly beat at the end, visible film grain.


