# Image-to-Image-to-Video Batch Configuration
#
# Two-step pipeline per source image:
#   1. Image generation via /nano_banana OR /openai_image (chosen per task)
#   2. Video generation via Kling /Image2Video using the generated image
#
# Folder layout per task:
#   {folder}/
#   ├── Source/             # input reference images
#   ├── Generated_Frames/   # intermediate generated images (reused on resume)
#   ├── Generated_Video/    # final mp4 videos
#   └── Metadata/

template_path: templates/I2V standard 4col.pptx

output:
  directory: /Users/ethanhsu/Desktop/ethan-hsu-cl/GAI/Report
  group_tasks_by: 3

testbed: http://192.168.31.161/external-testbed/image_generation/

schedule:
  start_time: ''

root_design_link: https://docs.google.com/presentation/d/1WFmn4Ae_oh65eSf26Xn0whtEE0cUa-l4Ww41HLlnCAQ/edit?slide=id.g3f5f513c1e8_0_0#slide=id.g3f5f513c1e8_0_0
root_source_video_link: https://cyberlinkcorp-my.sharepoint.com/:f:/g/personal/onedrive_qa1_cyberlink_com/IgC6xp0IzIjDTKHjB09WVzgqAb7Yld-kCxtYmZyxrA4YdMk?e=LsgdS9

# Reuse original i2i frames (video-only). If a task folder contains a dropped-in
# original-run folder, the handler stages a subset before processing (applied
# automatically by runall). See the reuse_original_* notes in comments: below.
reuse_original_frames: false
reuse_original_limit: 25
reuse_original_seed: 42
reuse_original_reset: false

# Global image-source selection defaults. Individual tasks can override any key.
use_random_source_selection: false
min_images: 2
max_images: 2
num_iterations: 25
use_deterministic_random: true
random_seed: 42
video_resolution: '720p'

tasks:
  - style_name: '羅馬建築前 V3'
    folder: 'Media Files/I2I2V/0730 3 Styles/0730 羅馬建築前 V3'
    image_service: nano_banana
    image_model: gemini-3.1-flash-image
    image_resolution: '1K'
    image_aspect_ratio: '3:4'
    use_multi_image: true
    multi_image_config:
      mode: sequential
    image_prompt: |
      Use the uploaded photos as the ONLY references for the human subjects. The uploaded photos may contain 1 to 4 different users. Create a final image with exactly the same number of people as the uploaded photos. Preserve each person's recognizable identity, facial features, skin tone, hairstyle, body proportions, and natural appearance individually. Each subject must clearly look like the corresponding person from the uploaded photos. Do not merge faces, swap identities, duplicate anyone, heavily stylize, over-beautify, or change identity. No extra main subject may appear.

      Create a realistic, elegant beauty portrait in an ancient Greek setting. Place the subject in front of grand classical Greek architecture with a wide Mediterranean coastal view. Include some Greek ruins or temple-like elements such as tall marble columns, stone steps, or pale stone walls, but do not let the background be dominated by stone architecture. Most of the background should open into distant ocean, clear blue sea, open sky, or a coastal horizon, creating a bright, spacious Mediterranean atmosphere. The image should feel timeless, graceful, luxurious, and visually striking, like a high-end fashion editorial.

      Style the subject in elegant ancient Greek fashion. Clothing must be white or ivory, inspired by authentic Greek draped garments, with soft flowing fabric, graceful folds, and refined classical styling. Add gold accessories such as a gold laurel crown or gold leaf headpiece, gold earrings, gold necklace, bracelets, arm cuffs, rings, or an ornate gold waist detail. The styling should feel noble, tasteful, and sophisticated, not theatrical.

      If the subject is female: dress her in a beautiful white or ivory ancient Greek gown such as a draped chiton, peplos, or Grecian one-shoulder / softly wrapped dress. Include refined gold details such as a gold belt, decorative shoulder clasp, gold trim, or a gold waist ornament. Add feminine gold jewelry and a delicate gold laurel crown or headpiece. Her hairstyle may be softly waved, braided, partially pinned up, or arranged in an elegant Greco-inspired updo, while still preserving her real hairstyle naturally. The overall look should feel graceful, regal, and goddess-like, but still realistic and tasteful.

      If the subject is male: dress him in a white or ivory ancient Greek outfit such as a draped chiton, tunic, or himation-style garment, with elegant layered fabric and classical structure. The outfit may include a draped shoulder cloth, wrapped waist detail, gold belt, subtle gold trim, gold arm cuffs, or a gold laurel crown. The styling should feel noble, heroic, and refined, with a clean classical silhouette rather than heavy armor.

      The pose is very important. Avoid a stiff straight-standing pose. The subject should appear relaxed, natural, graceful, and editorial. Use elegant, dynamic poses such as sitting on stone steps, leaning lightly against a marble column, resting one hand on a stone ledge, gently turning the body in a three-quarter angle, walking slowly through the ruins, looking into the distance, lightly touching jewelry or fabric, or shifting weight naturally in a poised fashion pose. The pose should feel alive, refined, and aesthetically composed rather than static or awkward.

      If multiple subjects are present, arrange them as a cohesive group portrait with varied but harmonious poses. Avoid making everyone stand in the same pose. The group should feel balanced, elegant, editorial, and naturally connected.

      Use flattering natural sunlight with a fixed, consistent luxury-editorial color treatment. The overall tone must be bright, clean, warm, and polished: creamy sunlit marble, ivory-white fabric, soft gold jewelry, clear pale-blue sky, and rich Mediterranean blue sea. Keep the palette refined and stable, with warm golden sunlight, soft beige stone, ivory white, soft gold, and crisp blue coastal tones. Avoid gray, dull, cold, muddy, greenish, overly orange, or flat phone-photo color. The image must feel like a professionally color-graded fashion portrait bathed in golden sunlight.

      The subject must be clearly under sunlight. Part of the body must be visibly bathed in direct sun, and the face must also be directly lit by sunlight. Do not place the subject entirely in shade. At least part of the forehead, cheeks, nose bridge, and lips must be illuminated by real sunlight, creating a clear balance of sunlit highlights and soft shadows while keeping the facial features readable and naturally defined. The eyes, nose bridge, cheeks, and mouth area must remain clearly visible and recognizable. Avoid lighting where the face is fully shaded, hidden by architectural shadow, or lit only by weak ambient bounce light.

      The composition should feel like a premium high-fashion editorial portrait. Use an eye-level or slightly low-angle camera perspective only, to create a more majestic, cinematic, fashion-editorial feeling. Do not use a high-angle or top-down view. Use a long-lens / telephoto look for a polished professional portrait feel, with elegant compression, clean subject separation, and a refined premium-camera look. The framing can be either half-body, three-quarter body, or full-body depending on the pose, but always keep the subject visually dominant. Frame the subject with columns or ruins, while keeping most of the background open to sea, sky, or coastal horizon. Avoid a background made entirely of pale stone surfaces.

      Keep the final image realistic, high-quality, and naturally photographed. Preserve believable anatomy, realistic fabric draping, natural hands, and proper interaction with the environment. Avoid cartoon style, fantasy exaggeration, modern clothing, modern accessories, messy background, extra people, distorted hands, awkward posture, text, logos, or watermarks. The final result should feel like an elegant ancient Greek-inspired editorial portrait of the uploaded person, beautifully posed among classical Greek ruins and columns, bathed in golden sunlight, with a clear Mediterranean sea-and-sky backdrop.

    video_model: v3
    video_mode: pro
    video_duration: 5
    video_ratio: '3:4'
    video_sound_enabled: true
    video_prompt: |
      Two people side by side, staying in place throughout: on the left a woman with long dark wavy hair, floral crown, cream Grecian gown; on the right a man in a white Grecian tunic. Both remain solid, opaque and fully visible head to feet in every frame — the man never fades, dissolves, or blends into the sky or columns.

      The colonnade keeps the same fluted pale-stone columns from the reference — no new columns, no roof, no beams appear. Existing columns may pass out of frame naturally; nothing is built to replace them.

      Small restrained movements: she straightens posture, one hand at her hip, turns slowly toward camera with a quiet composed expression. He shifts weight onto one leg, shoulders roll back, turns slowly toward camera. Feet planted. Fabric and loose hair drift softly in a breeze.

      Camera: a slow 180-degree orbit around the pair with a slight rise from low angle to eye level. Both people stay in a wide two-shot head-to-feet the whole time — the camera never pushes in or crops to a close-up.
    video_negative_prompt: |
      fading person, translucent figure, dissolving subject, blending into sky, missing person, close-up, push-in, extra columns, roof appearing, geometry distortion, extra people, face morphing, no columns pass between the camera and the subjects at any point.

    concurrent_requests: 3

